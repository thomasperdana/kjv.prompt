san Multi-Tingkat:\n   - \ud83d\udfe2 **Tingkat 1 \u2014 Mudah**: Konsep inti untuk anak 10 tahun, ayat kunci + penjelasan 1 kalimat, analogi, pertanyaan diagnostik, langkah tindakan mingguan.\n   - \ud83d\udfe1 **Tingkat 2 \u2014 Menengah**: Eksposisi paragraf-demi-paragraf (menganyam studi kata, sejarah, dan struktur), menjinakkan ranjau budaya, kesalahpahaman umum, tabel rujukan-cepat kesalahan.\n   - \ud83d\udd34 **Tingkat 3 \u2014 Ahli**: Kerangka teologis, wawasan kesarjanaan (creeds, confessions, khotbah), sudut debat (lensa Reformed, peringatan pastoral), penyelaman mendalam bahasa asli, kesalahan berkhotbah yang harus dihindari.\n6. Doktrin \u2014 apa yang teks ini ajarkan tentang Allah, manusia, Kristus, dan keselamatan\n7. Aplikasi \u2014 kepala (percaya), hati (mengasihi), tangan (melakukan): 2-3 poin masing-masing\n8. Pertanyaan Diskusi \u2014 10 total: 3 observasi, 4 interpretasi, 3 aplikasi; setiap pertanyaan terbuka, tidak ada yang dapat dijawab ya/tidak\n9. Ayat Hafalan (TB2) dengan satu baris alasan mengapa dipilih\n10. Anjuran doa penutup, Menggali Lebih Dalam (nas untuk pekan mendatang), dan Urutan Kurikulum (Modul 2-5)\n\n**LANGKAH 6 \u2014 Verifikasi & Mesin Roda Gila**\n- **Tahap Verifikasi**: Audit output Anda sendiri sebagai daftar periksa, cetak LULUS atau PERBAIKI per item: setiap kutipan sama persis dengan kata TB2; setiap referensi ada dan menopang klaimnya; setiap kata arkais diberi glos; lapisan KATAKAN / ARTINYA / MINTA tetap berbeda; kesepuluh komponen studi hadir; pembagian pertanyaan adalah 3 observasi, 4 interpretasi, 3 aplikasi; perbedaan pendapat dinyatakan secara adil. Perbaiki apa pun yang ditandai PERBAIKI dan cetak item yang telah diperbaiki.\n- **Audit Mandiri**: Nilai (1-10) pada 8 dimensi: Ketepatan Alkitabiah, Kejelasan Pedagogis, Penerapan Praktis, Keseimbangan Kedalaman vs. Keterjangkauan, Keterlibatan/Kreativitas, Kesetiaan pada TB2, Akar Kristologis, Peperangan Rohani.\n- **Tulis Ulang**: Identifikasi dimensi bernilai terendah. Tulis ulang bagian spesifik itu agar bernilai lebih tinggi. Tampilkan sebelum/sesudah.\n- **Spiral**: Sarankan 3 perbaikan spesifik untuk prompt ini. Tulis cuplikan revisi yang tepat untuk masing-masing. Berikan perintah siap-pakai yang tepat untuk modul berikutnya.\n\nMulailah dengan LANGKAH 1 sekarang dan lanjutkan hingga LANGKAH 6 tanpa menunggu izin.\n\n---\n\n## REFERENSI CEPAT\n\n| Elemen | Nilai |\n|--------|-------|\n| Nama prompt | `TB21` |\n| Pemanggilan | `/TB21` di Claude Code |\n| Versi default | TB2 (Terjemahan Baru Edisi Kedua) secara eksklusif \u2014 tanpa substitusi |\n| Dewan | 7 Sarjana (Filolog, Sejarawan, Sarjana Sastra, Teolog, Sejarawan Gereja, Gembala, Pengajar) |\n| Langkah proses | Langkah 1: Bingkai & Peta / Langkah 2: Ringkasan Pakar / Langkah 3: Musyawarah / Langkah 4: Sintesis / Langkah 5: Tulis Studi Multi-Tingkat / Langkah 6: Verifikasi & Roda Gila |\n| Lensa hermeneutik | Reformed \u2014 Kitab Suci menafsirkan Kitab Suci |\n| Komponen output studi | 10 bagian (Judul/Pemecah Kebekuan, Latar, Fondasi, Teks, Eksposisi Bertingkat, Doktrin, Aplikasi, Diskusi, Ayat Hafalan, Penutup/Menggali Lebih Dalam) |\n\n---\n\n## TINJAUAN PERBANDINGAN (Tiga Generasi Pendekatan)\n\n| Fitur | Pendekatan Multi-Tingkat | Pendekatan Dewan Berea | TB21 (Roda Gila Gabungan) |\n|-------|--------------------------|------------------------|----------------------------|\n| **Pembentukan Perspektif** | Persona AI tunggal | Panel 7 sarjana | Panel 7 sarjana dengan ringkasan terspesialisasi |\n| **Struktur Output** | Bagian multi-tingkat | Handout datar tunggal | Studi multi-tingkat terpadu yang dibangun dari masukan sarjana |\n| **Jangkar Fondasi** | Akar Kristologis & Peperangan Rohani di depan | Tidak ada | Akar Kristologis & Peperangan Rohani terintegrasi dalam ringkasan & fondasi |\n| **Musyawarah** | Tidak ada | Debat panel 3 pertanyaan | Debat panel 3 pertanyaan dengan tinjauan sejawat/koreksi |\n| **Mekanisme Audit** | Roda gila (8 dimensi, tulis ulang, perintah berikutnya) | Daftar periksa verifikasi | Daftar periksa terpadu + Audit Roda Gila 8 dimensi |\n\n---\n\n## CATATAN ADAPTASI\n\n- **TB21** adalah nama prompt (padanan Indonesia dari skill **bs34** versi KJV); **TB2** adalah versi Alkitab yang dipakai \u2014 Terjemahan Baru Edisi Kedua (LAI), diluncurkan 9 Februari 2023. Keduanya token yang berbeda \u2014 jangan dikelirukan: **\"TB21\" = nama prompt**, **\"TB2\" = versi Alkitab**.\n- **Dasar naskah**: TB2 adalah revisi dari TB (1974) di atas dasar naskah yang sama \u2014 Teks Masoret (PL) dan teks Yunani edisi kritis UBS/Nestle-Aland (PB), **bukan** Textus Receptus. TB2 memperbarui ejaan, sejumlah istilah, dan keterbacaan. Bila Anda menghendaki varian berbasis Textus Receptus atau Terjemahan Lama (TL), nyatakan saat memanggil.\n- **Epigraf (perlu verifikasi)**: teks Kisah Para Rasul 17:11 di atas mereproduksi rumusan yang terverifikasi dari sumber-sumber tradisi TB (1974). Edisi TB2 (2023) memperbarui ejaan (mis. \"dari pada\" \u2192 \"daripada\") dan mungkin sejumlah kata; ganti dengan teks TB2 resmi LAI saat tersedia, atau biarkan tertandai \"(verifikasi)\" sesuai Aturan 2. Generator wajib mengutip TB2 secara verbatim, jadi jangan menyalin rumusan yang belum dikonfirmasi sebagai TB2.\n- **Pembedaan kata ganti**: \"engkau/kau\" (tunggal) vs \"kamu/kamu sekalian\" (jamak) menggantikan thee/thou vs ye/you milik KJV; kapitalisasi kata ganti ilahi (Engkau, -Nya, -Mu) menggantikan catatan tipografi/italics KJV.\n- **Lensa hermeneutik** tetap Reformed (Kitab Suci menafsirkan Kitab Suci).\n\n---\n*TB21 \u2014 Roda Gila Dewan Berea & Multi-Tingkat TB2*\n*Thomas Perdana \u2014 Cash in Blue LLC*"}, {"folder": "prompt", "name": "1.prompt.tb22.md", "content": "# TB22 \u2014 Arsip Prompt Skill Lengkap\n\n> **Skill:** `TB22` \u2014 Pembangun Buku Studi Alkitab Reformed Dewan Berea memakai **Alkitab Terjemahan Baru edisi ke-2 (TB2)**.\n> Setara file-untuk-file dengan `Bs42`, namun dalam Bahasa Indonesia dan memakai TB2 (bukan KJV).\n> Lokasi langsung: `~/.claude/skills/TB22/`\n> Arsip ini memuat seluruh 9 berkas: 1 berkas routing (`SKILL.md`) + 8 berkas workflow.\n\n## Daftar Berkas\n\n| # | Berkas | Fungsi |\n|---|--------|--------|\n| 1 | `SKILL.md` | Routing utama, 3 contoh, gotchas Hanya-TB2 |\n| 2 | `Workflows/BuildWorkbook.md` | Dewan Berea (7 sarjana), Langkah 1\u20134 |\n| 3 | `Workflows/DraftLessons.md` | Templat pelajaran 16-poin, 3 tingkat |\n| 4 | `Workflows/BackMatter.md` | Glosarium/KBBI, Panduan Pemimpin, FAQ |\n| 5 | `Workflows/VerifyWorkbook.md` | Audit 9-butir PASS/FIX (TB2 verbatim) |\n| 6 | `Workflows/ExpandLesson.md` | `PERLUAS {pelajaran N}` |\n| 7 | `Workflows/AdaptAudience.md` | `SESUAIKAN {audiens}` |\n| 8 | `Workflows/LessonAnswers.md` | `JAWABAN {pelajaran N}` |\n| 9 | `Workflows/AddLesson.md` | `TAMBAH PELAJARAN {bagian}` |\n\n---\n\n## 1. Berkas routing utama \u2014 `~/.claude/skills/TB22/SKILL.md`\n\n````markdown\n---\nname: TB22\ndescription: Generator Buku Studi Alkitab Reformed gabungan Dewan Berea memakai Alkitab Terjemahan Baru edisi ke-2 (TB2). GUNAKAN KETIKA pengguna ingin membangun buku PA (pemahaman Alkitab) berbasis TB2, merancang pelajaran studi Alkitab dengan generator tb22, atau memadukan eksegese Reformed dengan proses Dewan Berea. Pemicu: tb22, buku PA TB2, studi Alkitab TB2, pelajaran Alkitab TONA.\n---\n# TB22\nPembangun Buku Studi Alkitab Reformed Dewan Berea (TB2). Menghimpun tujuh sarjana Dewan Berea untuk menyusun buku studi Alkitab yang mendalam dan siap-cetak dengan memakai **Alkitab Terjemahan Baru edisi ke-2 (TB2)** secara eksklusif. Skill ini memadukan kerigoran akademis, ringkasan pakar, dan tahap-tahap verifikasi dari **Bs41** dengan tingkat kesulitan pertanyaan 3-tingkat yang praktis, studi kasus, contoh modern, dan perkakas pelibatan pengajar tingkat lanjut dari **bs4-workbook**.\n\n## Voice Notification\n**Saat menjalankan sebuah workflow, lakukan KEDUANYA:**\n1. **Kirim notifikasi suara**:\n   ```bash\n   curl -s -X POST http://localhost:31337/notify \\\n     -H \"Content-Type: application/json\" \\\n     -d '{\"message\": \"Menjalankan workflow WORKFLOWNAME pada skill TB22 untuk ACTION\"}' \\\n     > /dev/null 2>&1 &\n   ```\n2. **Cetak notifikasi teks**:\n   ```\n   Menjalankan workflow **WorkflowName** pada skill **TB22** untuk ACTION...\n   ```\nDokumentasi lengkap: `~/.claude/PAI/DOCUMENTATION/Notifications/NotificationSystem.md`\n\n## Workflow Routing\n\n| Workflow | Pemicu | Berkas |\n|---|---|---|\n| BuildWorkbook | \"buat buku PA\", \"mulai pembangun studi\", \"tb22\" | Workflows/BuildWorkbook.md |\n| DraftLessons | \"susun pelajaran\", \"LANJUT pelajaran\" (CONTINUE) | Workflows/DraftLessons.md |\n| BackMatter | \"susun materi penutup\", \"buat backmatter\" | Workflows/BackMatter.md |\n| VerifyWorkbook | \"verifikasi buku\", \"jalankan pemeriksaan\" | Workflows/VerifyWorkbook.md |\n| ExpandLesson | \"PERLUAS pelajaran\" (EXPAND) | Workflows/ExpandLesson.md |\n| AdaptAudience | \"SESUAIKAN audiens\" (ADAPT) | Workflows/AdaptAudience.md |\n| LessonAnswers | \"JAWABAN pelajaran\" (ANSWERS) | Workflows/LessonAnswers.md |\n| AddLesson | \"TAMBAH PELAJARAN\" (ADD LESSON) | Workflows/AddLesson.md |\n\n## Examples\n\n### Example 1: Memulai sebuah buku gabungan\n**Pengguna:** \"tb22: kitab=Efesus, jumlah_pelajaran=5\"\n* Memanggil workflow `BuildWorkbook`\n* Memoderasi Langkah 1-4 (Bingkai, Ringkasan Pakar, Musyawarah, Cetak Biru)\n* Berhenti di checkpoint Langkah 4 untuk mencetak peta buku dan menunggu persetujuan\n\n### Example 2: Menyusun pelajaran dengan studi kasus dan perkakas\n**Pengguna:** \"LANJUT susun pelajaran 1\"\n* Memanggil workflow `DraftLessons`\n* Menyusun Pelajaran 1 memakai templat 16-poin terpadu (Mengamati, Menafsirkan, Menerapkan, Studi Kasus, Contoh Modern, dst.)\n\n### Example 3: Memverifikasi buku yang sudah selesai\n**Pengguna:** \"verifikasi buku\"\n* Memanggil workflow `VerifyWorkbook`\n* Melakukan audit ketat (kutipan TB2 verbatim, pemeriksaan definisi glosarium, kunci jawaban lengkap, kehadiran pernyataan \"Saya akan...\")\n\n## Gotchas\n* **Hanya TB2:** Jangan pernah memakai atau mengutip terjemahan lain (TB1 lama, BIS/BIMK, AYT, FAYH, KJV, ESV) sebagai teks studi. Periksa setiap ayat verbatim terhadap TB2. TB1 hanya boleh muncul sebagai catatan perbandingan berlabel dalam konteks filologi/glosarium.\n* **Hermeneutika Reformed:** Biarkan Alkitab menafsirkan Alkitab. Fokus pada teologi perjanjian, anugerah yang berdaulat, dan Hukum Penyebutan Pertama.\n* **Ruang Menulis:** Buku peserta harus memakai garis nyata `__________`. Eksposisi dan jawaban ada di Panduan Pemimpin.\n* **Tanpa Placeholder:** Hasilkan studi kasus alkitabiah dan contoh modern yang nyata tanpa memakai ringkasan placeholder.\n* **Verifikasi Rujukan:** Jangan pernah menebak nomor Strong atau rujukan ayat. Jika ragu, bubuhkan `(verifikasi)`.\n````\n\n---\n\n## 2. Berkas workflow \u2014 `~/.claude/skills/TB22/Workflows/`\n\n### 2.1 `BuildWorkbook.md`\n\n````markdown\n# BuildWorkbook Workflow\nWorkflow ini menjalankan Langkah 1 sampai 4 dari proses pembangun Buku Studi Alkitab gabungan Dewan Berea (TB2).\n\n## Voice Notification\n```bash\ncurl -s -X POST http://localhost:31337/notify \\\n  -H \"Content-Type: application/json\" \\\n  -d '{\"message\": \"Menjalankan workflow BuildWorkbook pada skill TB22 untuk menginisialisasi kurikulum dan cetak biru TB2\"}' \\\n  > /dev/null 2>&1 &\n```\nMenjalankan workflow **BuildWorkbook** pada skill **TB22** untuk menginisialisasi kurikulum dan cetak biru TB2...\n\n## Instructions\nHimpunkan Dewan Berea yang terdiri dari tujuh sarjana di bawah lensa hermeneutika Reformed (Alkitab menafsirkan Alkitab, teologi perjanjian, anugerah yang berdaulat):\n\n* **Ahli Filologi** (teks Masoret [PL] / Textus Receptus & teks kritis [PB], studi kata Ibrani/Yunani dengan nomor Strong; konvensi nama ilahi TB2 \u2014 **TUHAN** huruf-besar = YHWH, **Tuhan** = Adonai, **Allah** = Elohim; kata ganti ilahi berkapital \u2014 Engkau, -Nya, Dia, Kau-; kosakata baku/teologis TB2 yang perlu diglos ke bahasa sehari-hari dengan rujukan KBBI; perbandingan TB1\u2192TB2 sebagai catatan bila revisi memperjelas makna).\n* **Ahli Sejarah** (kepenulisan, tanggal, audiens, geografi, adat, politik).\n* **Ahli Sastra** (genre, struktur, argumen kitab, pengulangan, membagi pelajaran).\n* **Ahli Teologi** (doktrin sistematis Reformed, rujukan-silang di bawah kaidah Alkitab-menafsirkan-Alkitab).\n* **Ahli Sejarah Gereja** (pengakuan iman, konfesi, nyanyian/himne, khotbah).\n* **Gembala** (dosa disingkapkan, anugerah ditawarkan, penghiburan, menggembalakan tempat-tempat yang peka, penerapan pribadi).\n* **Arsitek Kurikulum** (tujuan pembelajaran, tangga pertanyaan 3-tingkat, studi kasus, contoh modern, garis tulis, Panduan Pemimpin).\n\nJalankan langkah-langkah berikut secara berurutan:\n\n### LANGKAH 1 \u2014 Membingkai Kurikulum\n1. Nyatakan ulang permintaan pengguna: Kitab/Bagian/Topik, Jumlah Pelajaran, Audiens (default kelompok kecil TONA), Durasi Sesi, Penekanan, Laju (Pacing).\n2. Jika diberi sebuah TOPIK, pilih 3-5 bagian jangkar dan beri alasan satu baris untuk masing-masing.\n3. Bagi materi menjadi `JUMLAH_PELAJARAN` pelajaran mengikuti struktur bagian/kitab.\n4. Nyatakan Gagasan Utama selingkup-buku dan 3-5 hasil yang harus dicapai peserta pada pelajaran terakhir.\n\n### LANGKAH 2 \u2014 Ringkasan Pakar\n1. Cetak judul untuk setiap sarjana secara bergiliran.\n2. Setiap sarjana memberi 5-8 temuan paling menentukan untuk seluruh studi.\n3. **Persyaratan minimum:**\n   * **Ahli Filologi:** satu kandidat studi kata per pelajaran (termasuk kandidat \"Hukum Penyebutan Pertama\").\n   * **Ahli Teologi:** 8-12 rujukan-silang.\n   * **Ahli Sejarah Gereja:** satu suara historis per pelajaran.\n   * **Arsitek Kurikulum:** draf tujuan per pelajaran.\n\n### LANGKAH 3 \u2014 Musyawarah Dewan\n1. Sebagai Moderator, ajukan tiga pertanyaan tersulit yang dimunculkan materi ini (titik tafsir krusial, ketegangan yang tampak, salah-baca yang umum).\n2. Mintalah sarjana yang relevan berdiskusi dalam dialog.\n3. Setiap sarjana wajib menantang atau mempertajam minimal satu klaim yang dibuat pada LANGKAH 2.\n4. Tutup setiap titik krusial dengan resolusi dari Kitab Suci, atau ringkasan yang adil atas pandangan-pandangan utama (dirutekan ke panel Pandangan A / Pandangan B pada pelajaran yang tepat).\n\n### LANGKAH 4 \u2014 Cetak Biru Buku\n1. Cetak peta pelajaran sebagai tabel markdown dengan kolom: `Pelajaran | Judul | Bagian | Gagasan Utama | Tujuan | Ayat Hafalan (rujukan TB2)`\n2. Tambahkan rencana materi-pembuka dan materi-penutup (memuat Tanya-Jawab pengajar, perkakas fasilitasi, dan perkakas studi peserta).\n3. **Aturan Laju:**\n   * Jika `LAJU = checkpoint` (default), **BERHENTI** di sini dan tunggu balasan pengguna (`SETUJU`/`APPROVE` atau penyesuaian).\n   * Jika `LAJU = run-all`, nyatakan asumsi kerja dan langsung lanjut ke `Workflows/DraftLessons.md` untuk menyusun pelajaran pertama.\n````\n\n### 2.2 `DraftLessons.md`\n\n````markdown\n# DraftLessons Workflow\nWorkflow ini menjalankan Langkah 5 dari proses pembangun buku gabungan, yaitu menyusun pelajaran.\n\n## Voice Notification\n```bash\ncurl -s -X POST http://localhost:31337/notify \\\n  -H \"Content-Type: application/json\" \\\n  -d '{\"message\": \"Menjalankan workflow DraftLessons pada skill TB22 untuk menyusun pelajaran memakai templat 16-poin\"}' \\\n  > /dev/null 2>&1 &\n```\nMenjalankan workflow **DraftLessons** pada skill **TB22** untuk menyusun pelajaran memakai templat 16-poin...\n\n## Instructions\nSusun pelajaran satu per satu, berurutan, sesuai Cetak Biru Buku yang telah disetujui.\n\nUntuk setiap pelajaran, pakai templat 16-poin yang tetap ini:\n\n1. **Judul** \u2014 Nomor pelajaran, judul, bagian, Gagasan Utama, tujuan: satu baris masing-masing.\n2. **Pembuka** \u2014 Sebuah fokus doa (usulkan Mazmur 119:18) dan satu pertanyaan pemanasan dengan garis tulis `__________`.\n3. **Menyiapkan Latar** \u2014 Konteks dari Ahli Sejarah dalam 150-250 kata.\n4. **Baca & Tandai** \u2014 Seluruh bagian dicetak dalam **TB2** dengan kunci penandaan: lingkari kata yang berulang, garis bawahi perintah, kotaki nama-nama Allah, garis-bawah-ganda janji-janji. Bagian lebih dari ~25 ayat tampil dalam seksi-seksi bertanda.\n5. **Mengamati (Tingkat 1: Mudah)** \u2014 5-8 pertanyaan \"apa yang dikatakannya?\" yang terkait ayat spesifik, garis tulis di bawah masing-masing. Fokus pada kata kunci TB2, siapa yang berbicara/dituju, dan fakta literal teks.\n6. **Cermati Bahasanya** \u2014 Kata baku/teologis TB2 yang jarang dipakai sehari-hari ditandai; peserta menulis makna sehari-hari di sampingnya sebelum mengecek Glosarium.\n7. **Studi Kata** \u2014 Sebuah tabel: `Kata TB2 | ayat | kata asli (transliterasi, nomor Strong) | makna | kolom penelusuran peserta (cari kemunculan TB2 lain, periksa Hukum Penyebutan Pertama, dan tulis apa yang ditambahkannya)`.\n8. **Menyelidiki Kitab Suci** \u2014 Sebuah rantai 3-6 rujukan-silang dengan satu baris ringkas tiap ayat, ditutup satu baris sintesis: apa yang diajarkan bagian-bagian ini bersama-sama? (lensa Reformed: Alkitab menafsirkan Alkitab).\n9. **Menafsirkan (Tingkat 2: Sedang)** \u2014 3-5 pertanyaan \"apa artinya?\". Poin yang diperdebatkan wajib tampil sebagai panel Pandangan A / Pandangan B dengan ayat-bukti dan tulis \"pandangan mana yang paling didukung teks, dan mengapa?\".\n10. **Studi Kasus: Kitab Suci dalam Tindakan** \u2014 Sebuah studi kasus alkitabiah yang menampilkan tokoh Alkitab (mis. Abraham, Daud, Paulus) yang menerapkan atau keliru menerapkan kebenaran inti pelajaran, ditutup dengan pertanyaan refleksi dan garis tulis.\n11. **Contoh Modern** \u2014 Sebuah skenario abad ke-21 yang realistis: seorang percaya menghadapi tantangan budaya atau iman, menyelesaikannya dengan menerapkan teks inti, dan mengalami hasil alkitabiah. Tambahkan pertanyaan refleksi dengan garis tulis.\n12. **Suara dari Sejarah Gereja** \u2014 Satu pengakuan iman, konfesi, nyanyian/himne, atau cuplikan khotbah singkat dengan satu baris refleksi.\n13. **Doktrin** \u2014 Satu paragraf yang menghubungkan bagian ini dengan seluruh nasihat Allah (perspektif Perjanjian Reformed), lalu garis \"nyatakan dengan kata-katamu sendiri\".\n14. **Menerapkan (Tingkat 3: Sulit)** \u2014 Pertanyaan Kepala (percaya), Hati (mengasihi), Tangan (melakukan) yang menghubungkan topik dengan Injil anugerah, ditutup dengan pernyataan komitmen konkret \"Saya akan...\".\n15. **Ayat Hafalan** \u2014 TB2 verbatim, dengan garis untuk menyalinnya di bawahnya.\n16. **Berkumpul** \u2014 4 pertanyaan diskusi kelompok dengan pengaturan waktu pemimpin dan isyarat fasilitasi (mis. teknik diam 7-10 detik, membandingkan Gagasan Utama) yang sesuai `DURASI_SESI`.\n\n## Aturan:\n* **Garis tulis:** Selalu pakai `__________` (minimal 2-3 garis per pertanyaan) agar peserta dapat menuliskan jawabannya.\n* **Jawaban:** Halaman peserta memuat pertanyaan dan aktivitas; eksposisi dan jawaban ada di Panduan Pemimpin (Langkah 6 / Materi Penutup). Jangan taruh jawaban di halaman peserta.\n* **Pemeriksaan Kesesuaian:** Setelah menyusun setiap pelajaran, lakukan pemeriksaan kesesuaian satu baris: cetak `PASS` atau `FIX` untuk masing-masing dari 16 komponen templat. Perbaiki setiap `FIX` sebelum melanjutkan.\n* **Batas Token:** Jika batas keluaran mendekat, berhenti di batas pelajaran dan cetak: *Berhenti di batas pelajaran [N]. Balas LANJUT untuk menyusun pelajaran berikutnya.*\n````\n\n### 2.3 `BackMatter.md`\n\n````markdown\n# BackMatter Workflow\nWorkflow ini menjalankan Langkah 6 dari proses pembangun buku gabungan, yaitu menyusun materi penutup.\n\n## Voice Notification\n```bash\ncurl -s -X POST http://localhost:31337/notify \\\n  -H \"Content-Type: application/json\" \\\n  -d '{\"message\": \"Menjalankan workflow BackMatter pada skill TB22 untuk menyusun materi penutup dan Panduan Pemimpin Reformed\"}' \\\n  > /dev/null 2>&1 &\n```\nMenjalankan workflow **BackMatter** pada skill **TB22** untuk menyusun materi penutup dan Panduan Pemimpin Reformed...\n\n## Instructions\nSusun komponen-komponen materi penutup berikut:\n\n1. **Cara Memakai Buku Ini** \u2014 Instruksi untuk jalur studi pribadi (memakai Hukum Penyebutan Pertama dan KBBI) maupun jalur diskusi kelompok.\n2. **Glosarium** \u2014 Daftarkan setiap kata baku/teologis TB2 yang ditandai dari pelajaran beserta definisi/glos sehari-harinya (rujukan KBBI).\n3. **Panduan Pemimpin:**\n   * Sediakan jawaban usulan dengan dukungan ayat untuk setiap pertanyaan peserta bernomor dari pelajaran (mencakup tingkat mengamati, menafsirkan, dan menerapkan).\n   * Rancang rencana pengaturan waktu pertemuan kelompok yang sesuai `DURASI_SESI` (mis. 75 menit).\n   * Tambahkan catatan penggembalaan dari Gembala untuk pertanyaan yang menyentuh tempat-tempat yang peka atau sensitif.\n4. **Tanya-Jawab Pengajar:**\n   * *T: Bagaimana jika peserta memakai versi Alkitab berbeda (mis. TB1 lama, BIS, AYT) dan bingung dengan kata-kata TB2?*\n   * *T: Bagaimana saya menangani seseorang yang sama sekali salah memahami suatu topik?*\n   * *T: Bagaimana jika kami tidak sempat melewati ketiga tingkat kesulitan?*\n5. **Trik & Kiat Lanjutan Pengajar:**\n   * **Pemrosesan Diam:** Tunggu dengan nyaman 7 sampai 10 detik dalam keheningan setelah mengajukan pertanyaan sebelum menjawabnya.\n   * **Pelibatan Kelompok:** Biarkan kelompok membaca ayat dengan suara nyaring bersama-sama, atau tanyakan kata mana yang paling menonjol bagi mereka.\n   * **Trik \"Rujukan-Silang\":** Menyimpan rujukan-silang tambahan sebagai cadangan untuk menghidupkan kembali diskusi.\n   * **Trik \"Penerapan\":** Memfasilitasi komitmen \"Saya akan...\" pada akhir sesi.\n6. **Menggali Lebih Dalam** \u2014 Usulkan bagian-bagian dan pertanyaan studi lanjutan untuk minggu-minggu berikutnya.\n````\n\n### 2.4 `VerifyWorkbook.md`\n\n````markdown\n# VerifyWorkbook Workflow\nWorkflow ini menjalankan Langkah 7 dari proses pembangun buku gabungan, yaitu memverifikasi seluruh buku.\n\n## Voice Notification\n```bash\ncurl -s -X POST http://localhost:31337/notify \\\n  -H \"Content-Type: application/json\" \\\n  -d '{\"message\": \"Menjalankan workflow VerifyWorkbook pada skill TB22 untuk mengaudit dan memverifikasi ketepatan buku\"}' \\\n  > /dev/null 2>&1 &\n```\nMenjalankan workflow **VerifyWorkbook** pada skill **TB22** untuk mengaudit dan memverifikasi ketepatan buku...\n\n## Instructions\nLakukan audit penuh atas buku yang telah dikompilasi. Cetak `PASS` atau `FIX` untuk masing-masing butir daftar periksa berikut:\n\n* **Kutipan Persis:** Setiap kutipan Kitab Suci cocok kata-per-kata dengan teks TB2.\n* **Integritas Rujukan:** Setiap rujukan ayat ada, akurat, dan mendukung klaim yang dinyatakan.\n* **Keselarasan Glosarium:** Setiap kata baku/teologis yang ditandai dari pelajaran terdefinisi di dalam Glosarium.\n* **Lapisan Terpisah:** Lapisan MENGATAKAN (mengamati), MAKNA (menafsirkan), dan MEMINTA (menerapkan) tetap terpisah dengan ketat.\n* **Dominasi Pertanyaan:** Halaman peserta tetap didominasi pertanyaan dengan garis tulis `__________`, menghindari teks eksposisi panjang (yang merupakan milik Panduan Pemimpin).\n* **Kelengkapan Studi Kasus & Contoh:** Studi kasus alkitabiah dan contoh modern tertulis penuh tanpa ringkasan placeholder.\n* **Jawaban Lengkap:** Panduan Pemimpin memiliki jawaban usulan untuk setiap pertanyaan peserta bernomor.\n* **Komitmen Penerapan:** Bagian penerapan setiap pelajaran ditutup dengan baris komitmen \"Saya akan...\".\n* **Ayat Hafalan Verbatim:** Ayat hafalan verbatim TB2.\n\nJika ada butir yang ditandai `FIX`, segera cetak teks/perbaikannya.\n````\n\n### 2.5 `ExpandLesson.md`\n\n````markdown\n# ExpandLesson Workflow\nWorkflow ini menangani perintah lanjutan `PERLUAS {pelajaran N}` (alias `EXPAND {lesson N}`).\n\n## Voice Notification\n```bash\ncurl -s -X POST http://localhost:31337/notify \\\n  -H \"Content-Type: application/json\" \\\n  -d '{\"message\": \"Menjalankan workflow ExpandLesson pada skill TB22 untuk memperkaya pelajaran\"}' \\\n  > /dev/null 2>&1 &\n```\nMenjalankan workflow **ExpandLesson** pada skill **TB22** untuk memperkaya pelajaran...\n\n## Instructions\nKetika pengguna meminta `PERLUAS {pelajaran N}` (atau `EXPAND {lesson N}`):\n\n1. Temukan pelajaran yang ditentukan di dalam buku.\n2. Himpunkan para sarjana Dewan Berea untuk memperdalam dan memperluas komponen-komponen pelajaran:\n   * **Ahli Filologi:** Tambahkan 1-2 studi kata tambahan (mis. menelusuri Hukum Penyebutan Pertama).\n   * **Ahli Teologi:** Tambahkan 2-3 rujukan-silang yang menentukan.\n   * **Gembala / Arsitek Kurikulum:** Tambahkan pertanyaan mengamati (Tingkat 1), menafsirkan (Tingkat 2), dan menerapkan (Tingkat 3) tambahan dengan garis tulis `__________`.\n   * **Studi Kasus / Contoh Modern:** Tambahkan detail latar atau pertanyaan penerapan reflektif lebih banyak.\n3. Susun ulang pelajaran secara penuh mengikuti Templat Pelajaran 16-poin standar.\n4. Lakukan pemeriksaan kesesuaian (PASS/FIX) untuk pelajaran yang diperbarui.\n````\n\n### 2.6 `AdaptAudience.md`\n\n````markdown\n# AdaptAudience Workflow\nWorkflow ini menangani perintah lanjutan `SESUAIKAN {audiens}` (alias `ADAPT {audience}`).\n\n## Voice Notification\n```bash\ncurl -s -X POST http://localhost:31337/notify \\\n  -H \"Content-Type: application/json\" \\\n  -d '{\"message\": \"Menjalankan workflow AdaptAudience pada skill TB22 untuk menyesuaikan fokus audiens buku\"}' \\\n  > /dev/null 2>&1 &\n```\nMenjalankan workflow **AdaptAudience** pada skill **TB22** untuk menyesuaikan fokus audiens buku...\n\n## Instructions\nKetika pengguna meminta `SESUAIKAN {audiens}` (mis. remaja, pemula sama sekali, gembala senior, keluarga):\n\n1. Tinjau pertanyaan-pertanyaan buku yang ada, studi kasus, contoh modern, catatan penggembalaan, dan langkah-langkah penerapan.\n2. Mintalah Gembala dan Arsitek Kurikulum memimpin revisi:\n   * Kalibrasi ulang nada, kompleksitas, dan kosakata pertanyaan 3-tingkat (Mengamati, Menafsirkan, Menerapkan).\n   * Sesuaikan skenario Studi Kasus dan Contoh Modern agar sangat relevan dan mewakili audiens baru.\n   * Sesuaikan langkah penerapan \"Saya akan...\" agar tepat secara perkembangan atau vokasi.\n   * Sesuaikan catatan penggembalaan dan Tanya-Jawab Pengajar di Panduan Pemimpin untuk menjawab kebutuhan spesifik, pergumulan umum, dan keberatan khas audiens baru.\n3. Perbarui buku dengan pertanyaan, penerapan, contoh, dan catatan penggembalaan yang telah direvisi.\n4. Pastikan kutipan dan rujukan TB2 tetap verbatim.\n````\n\n### 2.7 `LessonAnswers.md`\n\n````markdown\n# LessonAnswers Workflow\nWorkflow ini menangani perintah lanjutan `JAWABAN {pelajaran N}` (alias `ANSWERS {lesson N}`).\n\n## Voice Notification\n```bash\ncurl -s -X POST http://localhost:31337/notify \\\n  -H \"Content-Type: application/json\" \\\n  -d '{\"message\": \"Menjalankan workflow LessonAnswers pada skill TB22 untuk mencetak/memperluas jawaban Panduan Pemimpin\"}' \\\n  > /dev/null 2>&1 &\n```\nMenjalankan workflow **LessonAnswers** pada skill **TB22** untuk mencetak/memperluas jawaban Panduan Pemimpin...\n\n## Instructions\nKetika pengguna meminta `JAWABAN {pelajaran N}` (atau `ANSWERS {lesson N}`):\n\n1. Temukan pelajaran yang ditentukan di dalam buku.\n2. Hasilkan atau perluas jawaban Panduan Pemimpin yang terperinci untuk setiap pertanyaan bernomor (Mengamati Tingkat 1, Menafsirkan Tingkat 2, dan Menerapkan Tingkat 3) dalam pelajaran tersebut.\n3. Pastikan setiap jawaban:\n   * Didukung oleh rujukan Kitab Suci yang spesifik (TB2).\n   * Menjelaskan teks TB2 dengan jernih, mencatat makna kata baku/teologis atau implikasi teologis Reformed.\n   * Memuat catatan penggembalaan dari Gembala untuk menangani titik-titik diskusi yang sensitif.\n   * Menambahkan saran fasilitasi spesifik untuk pelajaran itu, seperti cara memancing peserta yang kesulitan dengan pertanyaan Tingkat 2 atau Tingkat 3, dan cara mendorong pernyataan \"Saya akan...\".\n4. Cetak jawaban yang lengkap dan diperluas dengan format yang jelas untuk pemimpin.\n````\n\n### 2.8 `AddLesson.md`\n\n````markdown\n# AddLesson Workflow\nWorkflow ini menangani perintah lanjutan `TAMBAH PELAJARAN {bagian}` (alias `ADD LESSON {passage}`).\n\n## Voice Notification\n```bash\ncurl -s -X POST http://localhost:31337/notify \\\n  -H \"Content-Type: application/json\" \\\n  -d '{\"message\": \"Menjalankan workflow AddLesson pada skill TB22 untuk menambahkan pelajaran baru ke dalam buku\"}' \\\n  > /dev/null 2>&1 &\n```\nMenjalankan workflow **AddLesson** pada skill **TB22** untuk menambahkan pelajaran baru ke dalam buku...\n\n## Instructions\nKetika pengguna meminta `TAMBAH PELAJARAN {bagian}` (atau `ADD LESSON {passage}`):\n\n1. Revisi tabel Cetak Biru Buku, dengan menambahkan judul pelajaran baru, bagian, Gagasan Utama, Tujuan, dan Ayat Hafalan.\n2. Susun pelajaran baru secara penuh mengikuti Templat Pelajaran 16-komponen yang tetap.\n3. Lakukan pemeriksaan kesesuaian (PASS/FIX) untuk pelajaran baru.\n4. Perbarui Panduan Pemimpin (mencakup jawaban, catatan penggembalaan, dan kiat fasilitasi) dan Glosarium di materi penutup agar memuat elemen-elemen pelajaran baru.\n````\n\n---\n\n*Arsip dihasilkan 2026-06-15 dari skill langsung `~/.claude/skills/TB22/`. Setara file-untuk-file dengan `Bs42`; memakai Alkitab Terjemahan Baru edisi ke-2 (TB2).*\n"}];

const fileListEl = document.getElementById('fileList');
const contentEl = document.getElementById('content');
const searchInput = document.getElementById('searchInput');

function formatSize(chars) {
  const kb = chars / 1024;
  return kb < 1 ? chars + ' B' : kb.toFixed(1) + ' KB';
}

function groupFiles(files) {
  const groups = {};
  files.forEach((f, idx) => {
    if (!groups[f.folder]) groups[f.folder] = [];
    groups[f.folder].push({ ...f, idx });
  });
  return groups;
}

let activeIdx = null;

function renderList(filterText) {
  const filter = (filterText || '').toLowerCase();
  const filtered = FILES
    .map((f, idx) => ({ ...f, idx }))
    .filter(f => f.name.toLowerCase().includes(filter) || f.folder.toLowerCase().includes(filter));

  const groups = {};
  filtered.forEach(f => {
    if (!groups[f.folder]) groups[f.folder] = [];
    groups[f.folder].push(f);
  });

  fileListEl.innerHTML = '';
  Object.keys(groups).forEach(folderName => {
    const label = document.createElement('div');
    label.className = 'group-label';
    label.textContent = folderName + ' (' + groups[folderName].length + ')';
    fileListEl.appendChild(label);

    groups[folderName].forEach(f => {
      const btn = document.createElement('button');
      btn.className = 'file-item' + (f.idx === activeIdx ? ' active' : '');
      btn.innerHTML = f.name + '<span class="meta-size">' + formatSize(f.content.length) + '</span>';
      btn.addEventListener('click', () => selectFile(f.idx));
      fileListEl.appendChild(btn);
    });
  });
}

function selectFile(idx) {
  activeIdx = idx;
  const f = FILES[idx];
  const html = marked.parse(f.content);
  contentEl.innerHTML =
    '<div class="doc-header">' +
      '<div class="breadcrumb">' + f.folder + '</div>' +
      '<h2>' + f.name + '</h2>' +
    '</div>' +
    '<div class="markdown-body">' + html + '</div>';
  contentEl.scrollTop = 0;
  renderList(searchInput.value);
}

searchInput.addEventListener('input', () => renderList(searchInput.value));

renderList('');
</script>

</body>
</html>
