The discipline that keeps this from becoming self-help:** the participant never originates life or light \u2014 he receives and reflects, \"for without me ye can do nothing\" (John 15:5). SOURCE DISCIPLINE (defined once in `SKILL.md`) enforces it, and V18 verifies it.\n\n**Structural consequence:** the question ladder grows from four levels to five (Level 5 \u2014 Life & Light: Bring It), the lesson template from 17 points to 19, and the verification pass from V1-V15 to V1-V18. Every file in this bundle uses those numbers consistently \u2014 the drift class v8.0 eliminated stays eliminated.\n\n---\n\n## HOW TO USE\n\n1. **Install or update the skill:** copy each fenced block below verbatim to its path under `~/.claude/skills/Kjv2222/`. The nine blocks are the nine files \u2014 nothing else is needed. v8.1 overwrites v8.0 in place; the skill name does not change.\n2. **Run it:** in a PAI session say `kjv2222: book=Ephesians, lesson_count=5` (or `kjv81: ...`, or any Book/Passage/Topic). The builder frames the curriculum, briefs the council, deliberates, and halts at the Blueprint checkpoint for your `APPROVE`.\n3. **Steer it:** reply `CONTINUE` to draft the next lesson or resume a paused output; `EXPAND {lesson N}`, `ADAPT {audience}`, `ANSWERS {lesson N}`, `ADD LESSON {passage}` for follow-ups.\n\nAll variables and their defaults are declared once, in `SKILL.md` \u00a7 Variables below \u2014 the single source of truth. So are the Life and Light definitions.\n\n---\n\n## THE FILES\n\n## File 1 of 9 \u2014 `~/.claude/skills/Kjv2222/SKILL.md`\n\n````markdown\n---\nname: Kjv2222\ndescription: Combined Berean Council and KJV Workbook Generator. USE WHEN user wants to build a KJV Bible study workbook, design a Bible study lesson using the kjv2222 / kjv81 generator, or combine Reformed exegesis with the Berean Council process. Every lesson also teaches how to bring life (John 10:10) and how to bring light (John 8:12).\n---\n# Kjv2222\n\nThe Berean Council Reformed KJV Workbook Builder \u2014 v8.1, Life & Light. Convenes the seven scholars of the Berean Council to construct deep, print-ready Bible study workbooks using the King James Version (KJV) exclusively. This skill combines the academic rigor, expert briefs, and verification passes of **KJV2211** with the practical question difficulty ladder, case studies, modern examples, and advanced teacher engagement tools of **bs4-workbook**.\n\nDEFINITION OF DONE: a leader could run the entire course from the printed workbook and Leader's Guide with zero additional preparation \u2014 every quotation exact, every participant page question-dominant with write-in lines, every answer in the Leader's Guide, the believer humbled and Christ magnified in every lesson, and every participant leaving each session with one named person to carry life to and one dark place to carry light into.\n\n## The Anchors\n\n- **LIFE** \u2014 \"The thief cometh not, but for to steal, and to kill, and to destroy: I am come that they might have life, and that they might have it more abundantly.\" \u2014 John 10:10 (KJV)\n- **LIGHT** \u2014 \"Then spake Jesus again unto them, saying, I am the light of the world: he that followeth me shall not walk in darkness, but shall have the light of life.\" \u2014 John 8:12 (KJV)\n- **JOINED** \u2014 \"In him was life; and the life was the light of men.\" \u2014 John 1:4 (KJV)\n- **SOURCE** \u2014 \"for without me ye can do nothing\" \u2014 John 15:5 (KJV)\n\n## Variables (single source of truth \u2014 all workflows read these)\n\n| Variable | Default | Used by |\n|---|---|---|\n| BOOK / PASSAGE / TOPIC | \u2014 (required) | all workflows |\n| LESSON_COUNT | 5 | BuildWorkbook, DraftLessons |\n| AUDIENCE | TONA small group | BuildWorkbook, AdaptAudience |\n| SESSION_LENGTH | 75 minutes | DraftLessons (Gather), BackMatter |\n| EMPHASIS | balanced (doctrinal / devotional / evangelistic) | BuildWorkbook |\n| PACING | checkpoint (or run-all) | BuildWorkbook |\n\nUnspecified variables take their defaults silently \u2014 begin at once, ask no questions. Life and Light are not variables: they are mandatory in every lesson, at every emphasis, for every audience.\n\n## Shared Definitions\n\n- **THE 5-LEVEL QUESTION LADDER** \u2014 Level 1: Observe (Easy) \u00b7 Level 2: Interpret (Medium) \u00b7 Level 3: Apply (Difficult) \u00b7 Level 4: Christocentric & Humility \u00b7 Level 5: Life & Light (Bring It). Every lesson climbs all five levels; every workflow uses this exact ladder.\n- **HUMILITY PRACTICES** \u2014 concrete tips, tricks, and daily hacks: specific mental exercises, habits, prayers, and spiritual practices for humbling oneself in the sight of the Lord and exalting Christ. Wherever this skill calls for Humility Practices, deliver at least 3, each doable within one day.\n- **THE LIFE PATHWAY** (John 10:10) \u2014 how a lesson teaches the participant to bring life, in four fixed slots:\n  (a) **THE THEFT** \u2014 the specific death, deadness, barrenness, or bondage this passage exposes, named in the passage's own terms, not in generalities.\n  (b) **THE SOURCE** \u2014 where the life actually is: Christ Himself, with the verse that says so, and the means He uses to give it (His word, His Spirit, His cross, His resurrection).\n  (c) **THE CHANNEL** \u2014 how that life passes *through* a believer to others as this passage frames it: words that quicken rather than kill (\"Death and life are in the power of the tongue\" \u2014 Proverbs 18:21), the gospel spoken plainly, forgiveness released, a burden carried, a hungry man fed, the barren thing tended until it bears.\n  (d) **LIFE PRACTICES** \u2014 at least 3, each doable within one day, at least one INWARD (how this believer receives Christ's life today) and at least one OUTWARD (how he carries it to a specific named person today).\n- **THE ABUNDANCE GUARD** \u2014 printed in every lesson: \"more abundantly\" in John 10:10 is fullness of life in Christ, not material prosperity, guaranteed ease, or freedom from suffering. Refuse that misreading out loud rather than leaving it unaddressed.\n- **THE LIGHT PATHWAY** (John 8:12) \u2014 how a lesson teaches the participant to bring light, in four fixed slots:\n  (a) **THE DARKNESS** \u2014 the specific darkness this passage addresses: ignorance, concealment, confusion, self-deceit, or the works done because no one is watching.\n  (b) **THE SOURCE** \u2014 Christ the light, with the verse; and how that light reaches a man (\"For God, who commanded the light to shine out of darkness, hath shined in our hearts, to give the light of the knowledge of the glory of God in the face of Jesus Christ.\" \u2014 2 Corinthians 4:6).\n  (c) **THE LAMP** \u2014 how light is carried: Scripture opened to someone in the dark (\"Thy word is a lamp unto my feet, and a light unto my path.\" \u2014 Psalm 119:105), truth told where a lie was convenient, hidden sin brought into the open and confessed, works of darkness reproved (\"And have no fellowship with the works of darkness, but rather reprove them.\" \u2014 Ephesians 5:11), and good works done visibly so that God, not the doer, is glorified (\"Let your light so shine before men, that they may see your good works, and glorify your Father which is in heaven.\" \u2014 Matthew 5:16).\n  (d) **LIGHT PRACTICES** \u2014 at least 3, each doable within one day, at least one that turns the light on the participant's OWN heart first, and at least one that carries light to another.\n- **THE LOVE GUARD** \u2014 printed in every lesson: light exposes, but a believer who exposes without love is glare, not light. Reproof is never license for accusation, contempt, or public shaming.\n- **SOURCE DISCIPLINE** \u2014 never present the participant as the origin of life or light. He is a channel and a reflector: \"for without me ye can do nothing\" (John 15:5). Every Humility, Life, and Light Practice must trace back to Christ with a verse, and no practice may be written so that it works by the participant's own energy, sincerity, or technique. Humility is not a separate topic from life and light \u2014 it is the posture in which both are received.\n- **THE LIFE & LIGHT PLANNERS** \u2014 the two participant write-in tables in lesson template points 16 and 17, where the participant names a person to carry life to and a dark place to carry light into, and dates it.\n- **THE 19-POINT LESSON TEMPLATE** \u2014 lives in `Workflows/DraftLessons.md`. Any workflow that drafts or re-drafts a lesson reads it there first.\n\n## Voice Notification\n\n**When executing a workflow, do BOTH:**\n\n1. **Send voice notification**:\n   ```bash\n   curl -s -X POST http://localhost:31337/notify \\\n     -H \"Content-Type: application/json\" \\\n     -d '{\"message\": \"Running the WORKFLOWNAME workflow in the Kjv2222 skill to ACTION\"}' \\\n     > /dev/null 2>&1 &\n   ```\n2. **Output text notification**:\n   ```\n   Running the **WorkflowName** workflow in the **Kjv2222** skill to ACTION...\n   ```\n\nFull documentation: `~/.claude/PAI/DOCUMENTATION/Notifications/NotificationSystem.md`\n\n## Workflow Routing\n\n| Workflow | Trigger | File |\n|---|---|---|\n| BuildWorkbook | \"build a workbook\", \"start study builder\", \"kjv2222\", \"kjv81\" | Workflows/BuildWorkbook.md |\n| DraftLessons | \"draft lesson\", \"CONTINUE lesson\" | Workflows/DraftLessons.md |\n| BackMatter | \"assemble back matter\", \"generate backmatter\" | Workflows/BackMatter.md |\n| VerifyWorkbook | \"verify workbook\", \"run verification pass\" | Workflows/VerifyWorkbook.md |\n| ExpandLesson | \"EXPAND lesson\" | Workflows/ExpandLesson.md |\n| AdaptAudience | \"ADAPT audience\" | Workflows/AdaptAudience.md |\n| LessonAnswers | \"ANSWERS lesson\" | Workflows/LessonAnswers.md |\n| AddLesson | \"ADD LESSON\" | Workflows/AddLesson.md |\n\n## Examples\n\n### Example 1: Initializing a combined workbook\n**User:** \"kjv2222: book=Ephesians, lesson_count=5\"\n* Invokes `BuildWorkbook` workflow\n* Moderates Steps 1-4 (Frame, Briefs, Deliberation incl. the Life & Light Audit, Blueprint)\n* Halts at the Step 4 checkpoint to print the workbook map \u2014 including each lesson's Life \u2192 Light line \u2014 and await approval\n\n### Example 2: Drafting a lesson with case studies and toolkits\n**User:** \"CONTINUE to draft lesson 1\"\n* Invokes `DraftLessons` workflow\n* Drafts Lesson 1 using the 19-point Lesson Template (Observe, Interpret, Apply, Christocentric & Humility, Bring Life, Bring Light, etc.)\n\n### Example 3: Verifying the completed workbook\n**User:** \"verify workbook\"\n* Invokes `VerifyWorkbook` workflow\n* Runs the numbered V1-V18 audit (KJV verbatim quotes, glossary alignment, complete answer keys, \"I will...\" statements, Humility Practices, Life Pathway, Light Pathway, Source Discipline)\n\n## Gotchas\n\n* **KJV Only:** Never use or quote rival translations (NIV, ESV, NASB, NKJV). Double-check all verses verbatim; if uncertain of exact wording, quote less and append `(verify)` \u2014 never approximate inside quotation marks.\n* **Reformed Hermeneutics:** Let scripture interpret scripture. Focus on covenantal theology, sovereign grace, and the Law of First Mention.\n* **Write-in Spaces:** Participant guides must use actual lines `__________`. Exposition and answers belong in the Leader's Guide.\n* **No Placeholders:** Generate real biblical case studies and modern examples without using placeholding summaries. The same rule binds the Life and Light Planners: real names go on the participant's line, not sample text.\n* **Verify References:** Never guess a Strong's number, verse reference, or historical quotation (creed, confession, hymn, sermon). Summarize a historical voice's known position rather than fabricate its words; if uncertain, append `(verify)`.\n* **Humility & Christ's Glory:** Every lesson must actively show how the believer is to humble themselves (reducing self-importance and pride) and make Christ more glorious (magnifying His name and work), delivering Humility Practices as defined above.\n* **Life & Light:** Every lesson must complete THE LIFE PATHWAY and THE LIGHT PATHWAY, print THE ABUNDANCE GUARD and THE LOVE GUARD, and carry both Planners with real write-in lines. A lesson that informs without bringing life, or heats without bringing light, is not finished \u2014 it is a `FIX`.\n* **Source Discipline:** Never write a practice, answer, or example that makes the participant the origin of life or light. Trace every practice to Christ with a verse.\n````\n\n## File 2 of 9 \u2014 `~/.claude/skills/Kjv2222/Workflows/BuildWorkbook.md`\n\n````markdown\n# BuildWorkbook Workflow\n\nThis workflow executes Steps 1 through 4 of the combined Berean Council and KJV Workbook builder process.\n\n## Voice Notification\n\n```bash\ncurl -s -X POST http://localhost:31337/notify \\\n  -H \"Content-Type: application/json\" \\\n  -d '{\"message\": \"Running the BuildWorkbook workflow in the Kjv2222 skill to initialize combined KJV curriculum and blueprint\"}' \\\n  > /dev/null 2>&1 &\n```\n\nRunning the **BuildWorkbook** workflow in the **Kjv2222** skill to initialize combined KJV curriculum and blueprint...\n\n## Instructions\n\nConvene the Berean Council of seven scholars under a Reformed hermeneutic lens (Scripture interprets Scripture, covenantal theology, sovereign grace):\n\n* **The Philologist** (Masoretic / Textus Receptus, word studies, Strong's numbers with the `(verify)` rule, archaic glosses, thee/thou vs. ye/you). Where the material speaks of life, death, light, or darkness, states which sense the KJV carries there.\n* **The Historian** (authorship, date, audience, geography, customs, politics).\n* **The Literary Scholar** (genre, structure, book argument, repetitions, divides lessons). Traces the life/death and light/darkness contrasts the material itself builds.\n* **The Theologian** (Reformed systematic doctrine, cross-references under the scripture-interprets-scripture rule). Establishes Christ as the single source of both life and light (John 1:4; John 10:10; John 8:12) \u2014 never the participant, never the workbook, never the method.\n* **The Church Historian** (creeds, confessions, hymns, sermons \u2014 summarize known positions, never fabricate quotations).\n* **The Pastor** (sin exposed, grace offered, comfort, shepherding tender places, personal application, Humility Practices, and THE LIFE PATHWAY and THE LIGHT PATHWAY for each lesson).\n* **The Curriculum Architect** (learning objectives, the 5-level question ladder, case studies, modern examples, the Life & Light Planners, write-in lines, Leader's Guide).\n\nExecute the following steps in sequence:\n\n### STEP 1 \u2014 Frame the Curriculum\n\n1. Restate the user's request with every variable resolved: Book/Passage/Topic, LESSON_COUNT (default 5), AUDIENCE (default TONA small group), SESSION_LENGTH (default 75 minutes), EMPHASIS (default balanced), PACING (default checkpoint). Apply defaults silently.\n2. If a TOPIC was given, choose 3-5 anchor passages and justify each in one line.\n3. Divide the material into `LESSON_COUNT` lessons along the passage/book's structure.\n4. State the workbook-wide Big Idea and 3-5 outcomes a participant should reach by the final lesson.\n5. State the workbook-wide **Life & Light Frame** in two sentences: the death this material speaks into and the life Christ gives instead; the darkness it exposes and the light Christ gives instead.\n\n### STEP 2 \u2014 Expert Briefs\n\n1. Print a heading for each scholar in turn.\n2. Each scholar gives their 5-8 most load-bearing findings for the whole study.\n3. **Minimum requirements:**\n   * **Philologist:** one word-study candidate per lesson (including \"Law of First Mention\" candidates).\n   * **Theologian:** 8-12 cross-references, plus the line from this material to Christ as the source of life and light (John 1:4).\n   * **Church Historian:** one historical voice per lesson.\n   * **Curriculum Architect:** draft objectives per lesson, at least one of them a *doing* objective \u2014 something the participant can do this week that brings life or light.\n   * **Pastor:** shepherding application; at least 3 Humility Practices for humbling oneself in the sight of the Lord and exalting Christ; and, per lesson, THE LIFE PATHWAY slots (a)-(c) and THE LIGHT PATHWAY slots (a)-(c). The full practice sets (\u22653 Life, \u22653 Light) are due in `Workflows/DraftLessons.md`.\n\n### STEP 3 \u2014 Council Deliberation\n\n1. As Moderator, pose the three hardest questions this material raises (interpretive cruxes, apparent tensions, common misreadings).\n2. Have relevant scholars discuss in dialogue.\n3. Every scholar must challenge or sharpen at least one claim made in STEP 2 \u2014 naming the scholar and the claim.\n4. Close each crux with a resolution from scripture, or a fair summary of the major views (routed to a View A / View B panel in the lesson where it belongs).\n5. Then pose a fourth, mandatory question \u2014 **THE LIFE & LIGHT AUDIT**:\n\n   > \"If a participant completed this whole course exactly as written, what in him would come alive, and what dark place would be lit? Name both, concretely, and say which lesson does it. If the honest answer is 'nothing but his notes,' the council names the fix before we blueprint.\"\n\n   The Pastor answers first; the Theologian checks the answer against SOURCE DISCIPLINE (has anything here been made to depend on the participant's own power?); the Curriculum Architect states which lesson component carries it and whether a Level 1 participant could do it. Print the fix if one was needed.\n\n### STEP 4 \u2014 Workbook Blueprint\n\n1. Print the lesson map as a markdown table with these columns: `Lesson | Title | Passage | Big Idea | Objective | Memory Verse (KJV ref) | Life \u2192 Light (what comes alive \u00b7 what gets lit)`\n2. Add the front-matter and back-matter plan (incorporating teacher FAQs, facilitation tools, student study toolkits, and the course-long Life & Light Ledger).\n3. **Pacing Rule:**\n   * If `PACING = checkpoint` (default), **STOP** here and wait for the user's reply (`APPROVE` or adjustments).\n   * If `PACING = run-all`, state working assumptions and proceed immediately to `Workflows/DraftLessons.md` to draft the first lesson.\n````\n\n## File 3 of 9 \u2014 `~/.claude/skills/Kjv2222/Workflows/DraftLessons.md`\n\n````markdown\n# DraftLessons Workflow\n\nThis workflow executes Step 5 of the combined workbook builder process, drafting the lessons. It owns THE 19-POINT LESSON TEMPLATE \u2014 other workflows (ExpandLesson, AddLesson) read it from here.\n\n## Voice Notification\n\n```bash\ncurl -s -X POST http://localhost:31337/notify \\\n  -H \"Content-Type: application/json\" \\\n  -d '{\"message\": \"Running the DraftLessons workflow in the Kjv2222 skill to draft lessons using the 19-point template\"}' \\\n  > /dev/null 2>&1 &\n```\n\nRunning the **DraftLessons** workflow in the **Kjv2222** skill to draft lessons using the 19-point template...\n\n## Instructions\n\nDraft the lessons one by one, in order, according to the approved Workbook Blueprint.\n\nFor each lesson, use this fixed, 19-point template:\n\n1. **Heading** \u2014 Lesson number, title, passage, Big Idea, objective: one line each.\n2. **Open** \u2014 A prayer focus (suggesting Psalm 119:18) and one warm-up question with write-in lines `__________`.\n3. **Setting the Scene** \u2014 The Historian's context in 150-250 words.\n4. **Read & Mark** \u2014 The full passage printed in the KJV with a marking key: circle repeated words, underline commands, box names of God, double-underline promises. Passages over ~25 verses appear in marked sections.\n5. **Observe (Level 1: Easy)** \u2014 5-8 \"what does it say?\" questions anchored to specific verses, write-in lines under each. Focus on key KJV words, who is speaking/addressed, and literal text facts.\n6. **Mind the Language** \u2014 Flagged archaic KJV words; the participant writes the modern sense beside each before checking the Glossary.\n7. **Word Study** \u2014 A table with columns: `KJV word | verse | original word (transliterated, Strong's #) | sense | participant lookup`. If uncertain of a Strong's number, write `(verify)` instead of guessing. The participant lookup column directs: look up another KJV occurrence (checking the Law of First Mention) and write what it adds.\n8. **Search the Scriptures** \u2014 A chain of 3-6 cross-references with a summary line for each, closing with one synthesis line: what do these passages together teach? (Reformed lens: Scripture interprets Scripture).\n9. **Interpret (Level 2: Medium)** \u2014 3-5 \"what does it mean?\" questions. Disputed points must appear as View A / View B panels with proof texts and a \"which view does the text best support, and why?\" write-in.\n10. **Case Study: Scripture in Action** \u2014 A biblical case study showing a Bible character (e.g. Abraham, David, Paul) applying or misapplying the core lesson truth, closing with a reflection question and write-in lines.\n11. **Modern Example** \u2014 A realistic 21st-century scenario showing a believer facing a cultural or faith challenge, resolving it by applying the core text, and experiencing the biblical result. Add a reflection question with write-in lines.\n12. **Voices from Church History** \u2014 One short creed, confession, hymn, or sermon excerpt with a reflection line. Quote only wording you are certain of; otherwise summarize the voice's known position and mark `(verify)`.\n13. **Doctrine** \u2014 One paragraph connecting the passage to the whole counsel of God (Reformed Covenantal perspective), then \"state it in your own words\" lines.\n14. **Apply (Level 3: Difficult)** \u2014 Head (believe), Heart (love), Hands (do) questions connecting the topic to the gospel of grace. Include questions on how to humble oneself before God and glorify Christ, closing with an \"I will...\" concrete commitment statement.\n15. **Christocentric & Humility (Level 4)** \u2014 Explain that every problem found in the scripture, the answer is Jesus; explain that every revelation or principle found in the scripture is found in Jesus, because in Jesus is hidden all the wisdom of God (Colossians 2:3). Detail how the passage calls us to humble ourselves before God and make Christ glorious, delivering Humility Practices for daily use. Add a reflection question with write-in lines.\n16. **Bring Life (Level 5a \u2014 John 10:10)** \u2014 Build THE LIFE PATHWAY for this passage on the participant page, in this order:\n    * **The Theft** \u2014 one or two sentences naming the specific death, deadness, barrenness, or bondage this passage exposes, in the passage's own terms.\n    * **The Source** \u2014 the Christ-and-verse line: where the life is, and how He gives it.\n    * **The Channel** \u2014 2-3 sentences on how that life passes through a believer to another person as this passage frames it.\n    * **Questions** \u2014 3-4 Level 5 questions with write-in lines: what has the thief stolen where I live? what does Christ give instead, and in whose life am I withholding it?\n    * **THE LIFE PLANNER** \u2014 a write-in table:\n\n      | Who around me is dead, dying, or deadened? (name) | What has the thief stolen there? | What does Christ give instead (verse) | What I will do about it this week | Done? |\n      |---|---|---|---|---|\n      | `__________` | `__________` | `__________` | `__________` | `____` |\n\n    * **Life Practices** \u2014 at least 3 from THE LIFE PATHWAY (d), each doable within one day, at least one inward and one outward, each traced to Christ with a verse per SOURCE DISCIPLINE.\n    * **Commitment** \u2014 `I will bring life to __________ by __________ before __________ (day).`\n    * **THE ABUNDANCE GUARD**, printed in italics on the page: *abundant life is fullness of life in Christ \u2014 not money, not ease, not freedom from suffering.*\n17. **Bring Light (Level 5b \u2014 John 8:12)** \u2014 Build THE LIGHT PATHWAY for this passage on the participant page, in this order:\n    * **The Darkness** \u2014 one or two sentences naming the specific darkness this passage addresses.\n    * **The Source** \u2014 the Christ-and-verse line: where the light is, and how it reaches a man.\n    * **The Lamp** \u2014 2-3 sentences on how the light is carried, in this passage's terms.\n    * **Questions** \u2014 3-4 Level 5 questions with write-in lines, the first one turned inward: what am I keeping in the dark, and what would change if I brought it out?\n    * **THE LIGHT PLANNER** \u2014 a write-in table, the first row reserved for the participant's own heart:\n\n      | Where is it dark? (mine first, then around me) | What is hidden there? | What light does Christ shine (verse) | How I carry it there this week \u2014 in love, not accusation | Done? |\n      |---|---|---|---|---|\n      | `__________` | `__________` | `__________` | `__________` | `____` |\n\n    * **Light Practices** \u2014 at least 3 from THE LIGHT PATHWAY (d), each doable within one day, at least one self-examining and one outward, each traced to Christ with a verse per SOURCE DISCIPLINE.\n    * **Commitment** \u2014 `I will carry light into __________ by __________ before __________ (day).`\n    * **THE LOVE GUARD**, printed in italics on the page: *light exposes, but light without love is glare; reproof is never license for contempt or public shaming.*\n18. **Memory Verse** \u2014 KJV verbatim, with copy-it-out lines beneath.\n19. **Gather** \u2014 4 group discussion questions with leader timing and facilitation cues (e.g. the 7-10 seconds silence technique, comparing Big Ideas) that fit `SESSION_LENGTH`. One of the four must be the naming round: each member reads out the name on his Life Planner and the dark place on his Light Planner.\n\n## Rules\n\n* **Write-in lines:** Always use `__________` (at least 2-3 lines per question) so that the participant can write in their answers.\n* **Answers:** Participant pages carry questions, planners, practices, and activities; exposition and answers live in the Leader's Guide (Back Matter). Do not put the answers in the participant pages.\n* **Life & Light Rule:** No lesson ships without both Planners present with real write-in lines, both commitment lines, both guards printed, and \u22653 Life Practices and \u22653 Light Practices. Practices must never be written so that they work by the participant's own energy \u2014 trace each to Christ with a verse (SOURCE DISCIPLINE).\n* **Conformity Check:** After drafting each lesson, perform a one-line conformity check: print `PASS` or `FIX` for each of the 19 template components. Correct any `FIX` before moving on.\n* **Token Limits:** If output limits approach, stop at a lesson boundary and print: *Stopping at lesson [N] boundary. Reply CONTINUE to draft the next lesson.*\n````\n\n## File 4 of 9 \u2014 `~/.claude/skills/Kjv2222/Workflows/BackMatter.md`\n\n````markdown\n# BackMatter Workflow\n\nThis workflow executes Step 6 of the combined workbook builder process, assembling the back matter.\n\n## Voice Notification\n\n```bash\ncurl -s -X POST http://localhost:31337/notify \\\n  -H \"Content-Type: application/json\" \\\n  -d '{\"message\": \"Running the BackMatter workflow in the Kjv2222 skill to assemble back matter and Reformed leader guide\"}' \\\n  > /dev/null 2>&1 &\n```\n\nRunning the **BackMatter** workflow in the **Kjv2222** skill to assemble back matter and Reformed leader guide...\n\n## Instructions\n\nAssemble the following back-matter components:\n\n1. **How to Use This Workbook** \u2014 Instructions for both individual study tracks (using the Law of First Mention, Webster's 1828) and group discussion tracks.\n2. **Glossary** \u2014 List every flagged archaic KJV word from the lessons alongside its modern definition/gloss.\n3. **Leader's Guide:**\n   * Provide suggested answers with verse support for every single numbered participant question from the lessons (all five levels of the question ladder), highlighting the Humility, Life, and Light Practices for daily application.\n   * For each lesson, print the **Life & Light Leader's Map**: the full LIFE PATHWAY (Theft, Source, Channel, Practices) and LIGHT PATHWAY (Darkness, Source, Lamp, Practices) with both guards, plus how to coach the two hard cases \u2014 the member who says \"there is no one for me to bring life to,\" and the member who wants to use the light on somebody else's sin.\n   * Design a group meeting timing plan that fits `SESSION_LENGTH` (default 75 minutes), with minutes explicitly allocated to the Level 5 naming round.\n   * Add the Pastor's shepherding notes for questions that touch tender or sensitive places \u2014 including the Light Planner's first row, which asks a participant to name his own darkness.\n4. **The Life & Light Ledger** \u2014 A course-long, one-page write-in tracker the participant keeps across all lessons:\n\n   | Lesson | The name I carried life to | What I did | The dark place I carried light into | What I did | Answered prayer / result |\n   |---|---|---|---|---|---|\n   | 1 | `__________` | `__________` | `__________` | `__________` | `__________` |\n\n   Add a closing line beneath it: this page records what Christ did through you, not what you achieved \u2014 \"for without me ye can do nothing\" (John 15:5).\n5. **Teacher FAQ:**\n   * *Q: What if a student uses a different Bible version and gets confused by the KJV wording?*\n   * *Q: How do I handle someone who totally misunderstands a topic?*\n   * *Q: What if we don't get through all 5 levels of difficulty?*\n   * *Q: What if someone reads \"life more abundantly\" as money, health, or an easy life?* (Answer from THE ABUNDANCE GUARD.)\n   * *Q: What if someone uses \"being light\" as permission to expose other people?* (Answer from THE LOVE GUARD.)\n   * *Q: What if a participant has no one to name on the Life Planner?* (Answer: start with the household, then the church roll, then the workplace; a name is always nearer than it feels.)\n6. **Advanced Teacher Hacks & Tricks:**\n   * **Silent Processing:** Comfortably wait 7 to 10 seconds in silence after asking a question before answering it.\n   * **Group Engagement:** Let the group read the verse aloud together, or ask which word jumps out to them most.\n   * **The \"Cross-Reference\" Hack:** Keeping extra cross-references in reserve to re-engage the discussion.\n   * **The \"Application\" Trick:** Facilitating the \"I will...\" commitments at the end of the session.\n   * **The \"Humbling & Exalting\" Hack:** Helping participants transition from intellectual learning to humbling themselves under God's hand and exalting Christ, using the Humility Practices.\n   * **The \"Bring Life\" Hack:** Run the naming round out loud \u2014 a name spoken in the group is acted on far more often than a name only written. Then open the next session by asking who did it, gently and without shaming the ones who did not.\n   * **The \"Bring Light\" Hack:** The leader goes first on the Light Planner's inward row, briefly and appropriately. A group will only bring its own darkness into the light behind someone who did it first.\n7. **Going Deeper** \u2014 Suggest further passages and study questions for the weeks beyond, including one passage each on life and on light.\n\n## Rules\n\n* **Token Limits:** The Leader's Guide is the longest output in the workbook. If output limits approach, stop at a component or lesson-answer boundary and print: *Stopping at [boundary]. Reply CONTINUE to assemble the next part.*\n````\n\n## File 5 of 9 \u2014 `~/.claude/skills/Kjv2222/Workflows/VerifyWorkbook.md`\n\n````markdown\n# VerifyWorkbook Workflow\n\nThis workflow executes Step 7 of the combined workbook builder process, verifying the entire workbook.\n\n## Voice Notification\n\n```bash\ncurl -s -X POST http://localhost:31337/notify \\\n  -H \"Content-Type: application/json\" \\\n  -d '{\"message\": \"Running the VerifyWorkbook workflow in the Kjv2222 skill to audit and verify workbook accuracy\"}' \\\n  > /dev/null 2>&1 &\n```\n\nRunning the **VerifyWorkbook** workflow in the **Kjv2222** skill to audit and verify workbook accuracy...\n\n## Instructions\n\nPerform a full audit of the compiled workbook. Print `PASS` or `FIX` beside each numbered item:\n\n* **V1 \u2014 Exact Quotations:** Every scripture quotation matches KJV wording exactly, or carries `(verify)`.\n* **V2 \u2014 Reference Integrity:** Every verse reference exists, is accurate, and supports the stated claim.\n* **V3 \u2014 No Fabricated History:** No invented creed, confession, hymn, or sermon quotations; uncertain wording is summarized or marked `(verify)`.\n* **V4 \u2014 KJV Exclusivity:** Scan the workbook \u2014 no rival translation (NIV, ESV, NASB, NKJV) is quoted or recommended anywhere.\n* **V5 \u2014 Glossary Alignment:** Every flagged archaic word from the lessons is defined in the Glossary.\n* **V6 \u2014 Distinct Layers:** The SAYS (observation), MEANS (interpretation), and ASKS (application) layers remain strictly separated.\n* **V7 \u2014 Question Dominance:** Participant pages remain question-dominant with write-in lines `__________` (at least 2-3 per question), avoiding long expository text (which belongs in the Leader's Guide).\n* **V8 \u2014 Full Ladder:** Every lesson climbs all five levels of the question ladder (Observe, Interpret, Apply, Christocentric & Humility, Life & Light).\n* **V9 \u2014 Fair Views:** Every disputed point appears as a View A / View B panel with proof texts.\n* **V10 \u2014 Case Study & Example Completeness:** Biblical case studies and modern examples are drafted in full with no placeholder summaries.\n* **V11 \u2014 Complete Answers:** The Leader's Guide has a suggested answer for every numbered participant question, across all five levels.\n* **V12 \u2014 Application Commitment:** Every lesson's apply section ends with an \"I will...\" commitment line, and both Level 5 commitment lines are present and dateable.\n* **V13 \u2014 Verbatim Memory Verses:** Memory verses are verbatim KJV, with copy-it-out lines.\n* **V14 \u2014 Timing Fits:** The Leader's Guide timing plan fits `SESSION_LENGTH`, including minutes for the Level 5 naming round.\n* **V15 \u2014 Humility & Christ's Glory:** Every lesson explicitly demonstrates how to humble oneself before God and magnify Christ, delivering at least 3 Humility Practices.\n* **V16 \u2014 Life Pathway Complete:** Every lesson's *Bring Life* component names the Theft, the Source with its verse, and the Channel; carries the Life Planner with real write-in lines; delivers at least 3 Life Practices (\u22651 inward, \u22651 outward and person-specific), each doable within one day; and prints THE ABUNDANCE GUARD.\n* **V17 \u2014 Light Pathway Complete:** Every lesson's *Bring Light* component names the Darkness, the Source with its verse, and the Lamp; carries the Light Planner with its inward first row; delivers at least 3 Light Practices (\u22651 self-examining, \u22651 outward), each doable within one day; and prints THE LOVE GUARD.\n* **V18 \u2014 Source Discipline:** No practice, answer, example, or planner row presents the participant as the origin of life or light; every practice traces back to Christ with a verse (John 15:5).\n\nIf any item is marked `FIX`, print the corrected text/fix immediately.\n\nClose the audit with one sentence answering the Step 3 Life & Light Audit question again, now against the finished workbook: what comes alive, and what gets lit? If the honest answer is \"nothing but his notes,\" raise a `FIX` on the lesson responsible.\n````\n\n## File 6 of 9 \u2014 `~/.claude/skills/Kjv2222/Workflows/ExpandLesson.md`\n\n````markdown\n# ExpandLesson Workflow\n\nThis workflow handles the follow-up command `EXPAND {lesson N}`. Read `Workflows/DraftLessons.md` first \u2014 it owns the 19-point Lesson Template and the conformity check used here.\n\n## Voice Notification\n\n```bash\ncurl -s -X POST http://localhost:31337/notify \\\n  -H \"Content-Type: application/json\" \\\n  -d '{\"message\": \"Running the ExpandLesson workflow in the Kjv2222 skill to enrich lesson\"}' \\\n  > /dev/null 2>&1 &\n```\n\nRunning the **ExpandLesson** workflow in the **Kjv2222** skill to enrich lesson...\n\n## Instructions\n\nWhen the user requests `EXPAND {lesson N}`:\n\n1. Locate the specified lesson in the workbook.\n2. Convene the Berean Council scholars to deepen and expand the lesson's components:\n   * **The Philologist:** Add 1-2 additional word studies (e.g. tracking the Law of First Mention).\n   * **The Theologian:** Add 2-3 load-bearing cross-references, at least one that ties this passage to Christ as the source of life or light.\n   * **The Pastor / Curriculum Architect:** Add additional questions across the 5-level ladder \u2014 Observe (Level 1), Interpret (Level 2), Apply (Level 3), Christocentric & Humility (Level 4), and Life & Light (Level 5) \u2014 with write-in lines `__________`.\n   * **The Pastor:** Deepen THE LIFE PATHWAY and THE LIGHT PATHWAY \u2014 sharpen the Theft and the Darkness into this audience's actual terms, and add one further Life Practice and one further Light Practice, each doable within one day and each traced to Christ with a verse.\n   * **Case Study / Modern Example:** Add more background detail or reflective application questions.\n3. Re-draft the lesson in full following the 19-point Lesson Template from `Workflows/DraftLessons.md`, keeping both Planners, both commitment lines, and both guards intact.\n4. Perform the conformity check (PASS/FIX) for the updated lesson.\n````\n\n## File 7 of 9 \u2014 `~/.claude/skills/Kjv2222/Workflows/AdaptAudience.md`\n\n````markdown\n# AdaptAudience Workflow\n\nThis workflow handles the follow-up command `ADAPT {audience}`.\n\n## Voice Notification\n\n```bash\ncurl -s -X POST http://localhost:31337/notify \\\n  -H \"Content-Type: application/json\" \\\n  -d '{\"message\": \"Running the AdaptAudience workflow in the Kjv2222 skill to adapt workbook audience focus\"}' \\\n  > /dev/null 2>&1 &\n```\n\nRunning the **AdaptAudience** workflow in the **Kjv2222** skill to adapt workbook audience focus...\n\n## Instructions\n\nWhen the user requests `ADAPT {audience}` (e.g., teenagers, absolute beginners, senior pastors, families):\n\n1. Review the existing workbook questions, case study, modern example, shepherding notes, Life & Light Planners, and application steps.\n2. Have the Pastor and Curriculum Architect lead the revision:\n   * Recalibrate the tone, complexity, and vocabulary of the full 5-level question ladder (Levels 1-5).\n   * Tailor the Humility Practices for humbling oneself and glorifying Christ to be developmentally or vocationally appropriate for the new audience.\n   * Tailor the Life Practices and the Life Planner to the people this audience actually has in reach \u2014 classmates and siblings for teenagers, shut-ins and grandchildren for seniors, staff and elders for pastors, one another for families.\n   * Tailor the Light Practices and the Light Planner to this audience's real darkness \u2014 the phone at night, the ledger nobody audits, the reputation being managed, the silence at the dinner table \u2014 keeping the inward row first and THE LOVE GUARD prominent.\n   * Tailor the Case Study and Modern Example scenarios to be highly relatable and representative of the new audience.\n   * Adjust the \"I will...\" application steps and both Level 5 commitment lines to be developmentally or vocationally appropriate.\n   * Adjust shepherding notes and Teacher FAQ in the Leader's Guide to address the specific needs, common struggles, and typical objections of the new audience.\n3. Update the workbook with the revised questions, applications, examples, planners, and shepherding notes.\n4. Ensure KJV quotes and references remain verbatim, and that SOURCE DISCIPLINE still holds in every rewritten practice.\n````\n\n## File 8 of 9 \u2014 `~/.claude/skills/Kjv2222/Workflows/LessonAnswers.md`\n\n````markdown\n# LessonAnswers Workflow\n\nThis workflow handles the follow-up command `ANSWERS {lesson N}`.\n\n## Voice Notification\n\n```bash\ncurl -s -X POST http://localhost:31337/notify \\\n  -H \"Content-Type: application/json\" \\\n  -d '{\"message\": \"Running the LessonAnswers workflow in the Kjv2222 skill to print or enlarge Leader Guide answers\"}' \\\n  > /dev/null 2>&1 &\n```\n\nRunning the **LessonAnswers** workflow in the **Kjv2222** skill to print or enlarge Leader Guide answers...\n\n## Instructions\n\nWhen the user requests `ANSWERS {lesson N}`:\n\n1. Locate the specified lesson in the workbook.\n2. Generate or expand the detailed Leader's Guide answers for every single numbered question across the 5-level ladder \u2014 Observe (Level 1), Interpret (Level 2), Apply (Level 3), Christocentric & Humility (Level 4), and Life & Light (Level 5) \u2014 in that lesson.\n3. Ensure every answer:\n   * Is supported by specific scripture references (KJV).\n   * Explains the KJV text clearly, noting any archaic word meanings or Reformed theological implications.\n   * Includes shepherding notes from the Pastor for handling sensitive discussion points.\n   * Adds specific facilitation advice for that lesson, such as how to prompt students who struggle with Level 2, Level 3, Level 4, or Level 5 questions, and how to encourage the \"I will...\" statements.\n4. For the Level 5 questions specifically, the answers are model answers, not the only answers \u2014 the Planners are the participant's own. Supply:\n   * a worked example of a filled Life Planner row and a filled Light Planner row for this lesson;\n   * how to coach the member who cannot name anyone to bring life to;\n   * how to redirect the member who fills the Light Planner with other people's sins and none of his own (THE LOVE GUARD);\n   * how to answer the member who expects \"life more abundantly\" to mean money, health, or ease (THE ABUNDANCE GUARD);\n   * one line reminding the leader to keep SOURCE DISCIPLINE in the room: the group brings nothing Christ has not first given.\n5. Output the complete, expanded answers clearly formatted for the leader. If output limits approach, stop at a question boundary and print: *Stopping at [boundary]. Reply CONTINUE for the remaining answers.*\n````\n\n## File 9 of 9 \u2014 `~/.claude/skills/Kjv2222/Workflows/AddLesson.md`\n\n````markdown\n# AddLesson Workflow\n\nThis workflow handles the follow-up command `ADD LESSON {passage}`. Read `Workflows/DraftLessons.md` first \u2014 it owns the 19-point Lesson Template and the conformity check used here.\n\n## Voice Notification\n\n```bash\ncurl -s -X POST http://localhost:31337/notify \\\n  -H \"Content-Type: application/json\" \\\n  -d '{\"message\": \"Running the AddLesson workflow in the Kjv2222 skill to append a new lesson to the workbook\"}' \\\n  > /dev/null 2>&1 &\n```\n\nRunning the **AddLesson** workflow in the **Kjv2222** skill to append a new lesson to the workbook...\n\n## Instructions\n\nWhen the user requests `ADD LESSON {passage}`:\n\n1. Revise the Workbook Blueprint table, appending the new lesson title, passage, Big Idea, Objective, Memory Verse, and its Life \u2192 Light line.\n2. Draft the new lesson in full following the 19-point Lesson Template from `Workflows/DraftLessons.md`.\n3. Perform the conformity check (PASS/FIX) for the new lesson.\n4. Update the Leader's Guide (including answers across all five levels, the lesson's Life & Light Leader's Map, shepherding notes, and facilitation tips), the Life & Light Ledger (add the new lesson's row), and the Glossary in the back matter to include the new lesson's elements.\n````\n\n---\n\n## QUICK REFERENCE\n\n| Element | Value |\n| ------- | ----- |\n| Skill name | `Kjv2222` |\n| Invoke | `kjv2222: book=..., lesson_count=...` in a PAI session (alias trigger: `kjv81`) |\n| Translation | KJV exclusively \u2014 no substitution |\n| The Council | 7 scholars: Philologist, Historian, Literary Scholar, Theologian, Church Historian, Pastor, Curriculum Architect |\n| Process | 1 Frame \u2192 2 Briefs \u2192 3 Deliberation (+ Life & Light Audit) \u2192 4 Blueprint (checkpoint) \u2192 5 Draft Lessons \u2192 6 Back Matter \u2192 7 Verify |\n| Lesson shape | The 19-point Lesson Template (owned by DraftLessons.md) |\n| Question ladder | 5 levels: Observe \u00b7 Interpret \u00b7 Apply \u00b7 Christocentric & Humility \u00b7 Life & Light |\n| Verification | V1-V18 (PASS/FIX), closing with the Life & Light Audit re-asked |\n| Life anchor | John 10:10 \u2014 the Theft, the Source, the Channel, \u22653 Life Practices, Life Planner, Abundance Guard |\n| Light anchor | John 8:12 \u2014 the Darkness, the Source, the Lamp, \u22653 Light Practices, Light Planner, Love Guard |\n| Joining verse | John 1:4 \u2014 \"In him was life; and the life was the light of men.\" |\n| Source discipline | The participant channels and reflects; he never originates (John 15:5) |\n| Course-long artifact | The Life & Light Ledger (back matter) \u2014 one row per lesson, name and dark place logged |\n| Hermeneutic lens | Reformed \u2014 Scripture interprets Scripture, covenantal theology, sovereign grace |\n| Follow-ups | `APPROVE`, `CONTINUE`, `EXPAND {lesson N}`, `ADAPT {audience}`, `ANSWERS {lesson N}`, `ADD LESSON {passage}` |\n\n---\n\n## CHANGELOG \u2014 v8.0 \u2192 v8.1\n\n1. **Life added as a binding definition.** THE LIFE PATHWAY (John 10:10) is defined once in `SKILL.md` \u2014 the Theft, the Source, the Channel, and \u22653 same-day Life Practices with at least one inward and one outward \u2014 and every workflow references it by name.\n2. **Light added as a binding definition.** THE LIGHT PATHWAY (John 8:12) is defined once in the same place \u2014 the Darkness, the Source, the Lamp, and \u22653 same-day Light Practices with at least one self-examining and one outward.\n3. **The two are joined, not stacked.** John 1:4 is the doctrinal spine: the life Christ gives is what becomes light in a man. The Theologian must draw that line in STEP 2, so Life and Light never become two unrelated units of curriculum.\n4. **The ladder grew from 4 levels to 5.** Level 5 \u2014 Life & Light (Bring It) makes \"how to bring life\" and \"how to bring light\" a question-dominant, write-in section of every lesson instead of a paragraph inside Level 4. Every file that names the ladder was updated in the same pass (SKILL.md, BuildWorkbook, DraftLessons, BackMatter, VerifyWorkbook, ExpandLesson, AdaptAudience, LessonAnswers, AddLesson) \u2014 the v8.0 drift class stays closed.\n5. **The template grew from 17 points to 19.** New point 16 *Bring Life* and new point 17 *Bring Light*; Memory Verse and Gather shift to 18 and 19. The conformity check now runs over 19 components.\n6. **Two participant planners.** THE LIFE PLANNER asks for a name; THE LIGHT PLANNER reserves its first row for the participant's own darkness. Both carry dateable commitment lines: \"I will bring life to ___ by ___ before ___.\"\n7. **Two guards printed on the page.** THE ABUNDANCE GUARD refuses the prosperity misreading of \"more abundantly\"; THE LOVE GUARD refuses reproof that curdles into contempt or public shaming. Both also become Teacher FAQ entries with answers.\n8. **Source Discipline added.** Life and light are Christ's; the participant channels and reflects them (John 15:5). Every practice traces to Christ with a verse, and none may run on the participant's own energy \u2014 checked by V18 and re-stated at the bottom of the Ledger.\n9. **A fourth mandatory deliberation question.** STEP 3's LIFE & LIGHT AUDIT asks what would actually come alive and what would actually be lit if a participant finished the course, names which lesson does it, and forces a fix when the honest answer is \"nothing but his notes.\" VerifyWorkbook re-asks it against the finished workbook.\n10. **Verification grew from V1-V15 to V1-V18** \u2014 adding Life Pathway completeness (V16), Light Pathway completeness (V17), and Source Discipline (V18) \u2014 with V8, V11, V12, and V14 updated for the fifth level and its naming round.\n11. **Back matter gained two components and three FAQs.** The Life & Light Leader's Map per lesson, the course-long Life & Light Ledger, plus FAQs for the prosperity misreading, the weaponized-light member, and the participant who \"has no one\" to name.\n12. **Two new teacher hacks.** The *Bring Life* hack (name it out loud, then ask next session who did it \u2014 without shaming those who didn't) and the *Bring Light* hack (the leader goes first on the inward row; a group only brings its darkness out behind someone who did).\n13. **Small charges added to existing roles.** The Philologist states which sense of life/death/light/darkness the KJV carries; the Literary Scholar traces the material's own life-death and light-dark contrasts; the Curriculum Architect owes at least one *doing* objective; the Blueprint table gains a `Life \u2192 Light` column; ADAPT tailors both planners to the audience's actual reach and actual darkness.\n14. **Unchanged from v8.0:** 4-backtick outer fences so the nine blocks render and install correctly, the canonical variable table with apply-defaults-silently, KJV-only quotation discipline with `(verify)`, anti-fabrication extended to church history, portable `~/.claude/...` paths, the continuation protocols, the named-scholar challenge rule in STEP 3, and the Colossians 2:3 anchor in Level 4.\n\n---\n\n*KJV2222 v8.1 \u2014 The Berean Council Workbook Builder (Skill Bundle)*\n*\"I am come that they might have life\" (John 10:10) \u00b7 \"I am the light of the world\" (John 8:12)*\n*Thomas Perdana \u2014 Cash in Blue LLC*\n"}, {"folder": "prompt", "name": "1.prompt.kjv.82.md", "content": "# KJV2222 v8.2 \u2014 The Berean Council Workbook Builder (Skill Bundle)\n\n**Reformed KJV Workbook Generator \u2014 Humility, Christ's Glory, Life, Light & Detailed Doctrines Edition**\n\n**Version:** 8.2 \u2014 Detailed Doctrines Pass (increment of v8.1's Life & Light Pass)\n**Created by:** Thomas Perdana \u2014 Cash in Blue LLC\n**Translation:** KJV exclusively \u2014 no substitutions, no mixing.\n\nThis document is the complete, installable reference bundle for the **Kjv2222** PAI skill: one `SKILL.md` routing file plus eight workflow files. It combines the academic rigor of KJV2211 (Berean Council, expert briefs, verification passes) with the practical workbook machinery of bs4-workbook (question ladder, case studies, write-in lines, Leader's Guide) \u2014 and, from v8.1 forward, it teaches every participant **how to bring life** and **how to bring light**, while v8.2 requires the system to **summarize in great details the doctrines for the [topic or scripture reference]**.\n\n> \"These were more noble than those in Thessalonica, in that they received the word with all readiness of mind, and searched the scriptures daily, whether those things were so.\" \u2014 Acts 17:11 (KJV)\n\n> \"The thief cometh not, but for to steal, and to kill, and to destroy: I am come that they might have life, and that they might have it more abundantly.\" \u2014 John 10:10 (KJV)\n\n> \"Then spake Jesus again unto them, saying, I am the light of the world: he that followeth me shall not walk in darkness, but shall have the light of life.\" \u2014 John 8:12 (KJV)\n\n> \"Take heed unto thyself, and unto the doctrine; continue in them: for in doing this thou shalt both save thyself, and them that hear thee.\" \u2014 1 Timothy 4:16 (KJV)\n\n> \"In him was life; and the life was the light of men.\" \u2014 John 1:4 (KJV)\n\n---\n\n## WHAT v8.2 ADDS\n\nv8.0 repaired the bundle's structure and made every definition single-source. v8.1 added Life (John 10:10) and Light (John 8:12). v8.2 adds exhaustive, systematic doctrinal summarization:\n\n- **DETAILED DOCTRINAL SUMMARIZATION** \u2014 Every lesson and curriculum blueprint is explicitly commanded: **summarize in great details the doctrines for the [topic or scripture reference]**. Doctrine is never reduced to a brief generic paragraph. The system systematically extracts and expounds all sound biblical doctrines taught, implied, and anchored in the passage (Theology Proper, Christology, Pneumatology, Anthropology, Hamartiology, Soteriology, Ecclesiology, Eschatology, and Covenantal Sanctification).\n- **LESSON TEMPLATE POINT 13 ENHANCEMENT** \u2014 Point 13 (*Doctrine*) in the 19-point Lesson Template is structured into clear systematic categories: (1) formal theological proposition, (2) textual exegesis from the passage, (3) verbatim KJV cross-references (Scripture interprets Scripture), (4) refutation of opposing errors, and (5) participant write-in synthesis lines.\n- **THEOLOGIAN MANDATE** \u2014 The Theologian in `BuildWorkbook.md` is charged to summarize in great details the doctrines across the whole curriculum and for each individual lesson.\n- **LEADER'S GUIDE DOCTRINAL HARMONY** \u2014 `BackMatter.md` and `LessonAnswers.md` provide deep theological answer keys and pastoral guidance for facilitating deep doctrinal discussions.\n\n---\n\n## HOW TO USE\n\n1. **Install or update the skill:** copy each fenced block below verbatim to its path under `~/.claude/skills/Kjv2222/`. The nine blocks are the nine files \u2014 nothing else is needed. v8.2 overwrites earlier versions in place; the skill name does not change.\n2. **Run it:** in a PAI session say `kjv2222: book=Ephesians, lesson_count=5` (or `kjv82: ...`, or any Book/Passage/Topic). The builder frames the curriculum, briefs the council, deliberates, and halts at the Blueprint checkpoint for your `APPROVE`.\n3. **Steer it:** reply `CONTINUE` to draft the next lesson or resume a paused output; `EXPAND {lesson N}`, `ADAPT {audience}`, `ANSWERS {lesson N}`, `ADD LESSON {passage}` for follow-ups.\n\nAll variables and their defaults are declared once, in `SKILL.md` \u00a7 Variables below \u2014 the single source of truth. So are the Life, Light, and Doctrine definitions.\n\n---\n\n## THE FILES\n\n## File 1 of 9 \u2014 `~/.claude/skills/Kjv2222/SKILL.md`\n\n````markdown\n---\nname: Kjv2222\ndescription: Combined Berean Council and KJV Workbook Generator. USE WHEN user wants to build a KJV Bible study workbook, design a Bible study lesson using the kjv2222 / kjv82 generator, or combine Reformed exegesis with the Berean Council process. Every lesson also teaches how to bring life (John 10:10), how to bring light (John 8:12), and summarizes in great details the doctrines for the topic or scripture reference.\n---\n# Kjv2222\n\nThe Berean Council Reformed KJV Workbook Builder \u2014 v8.2, Detailed Doctrines, Life & Light. Convenes the seven scholars of the Berean Council to construct deep, print-ready Bible study workbooks using the King James Version (KJV) exclusively. This skill combines the academic rigor, expert briefs, and verification passes of **KJV2211** with the practical question difficulty ladder, case studies, modern examples, systematic doctrinal depth, and advanced teacher engagement tools of **bs4-workbook**.\n\nDEFINITION OF DONE: a leader could run the entire course from the printed workbook and Leader's Guide with zero additional preparation \u2014 every quotation exact, every participant page question-dominant with write-in lines, every doctrine summarized in exhaustive systematic detail, every answer in the Leader's Guide, the believer humbled and Christ magnified in every lesson, and every participant leaving each session with one named person to carry life to and one dark place to carry light into.\n\n## The Anchors\n\n- **LIFE** \u2014 \"The thief cometh not, but for to steal, and to kill, and to destroy: I am come that they might have life, and that they might have it more abundantly.\" \u2014 John 10:10 (KJV)\n- **LIGHT** \u2014 \"Then spake Jesus again unto them, saying, I am the light of the world: he that followeth me shall not walk in darkness, but shall have the light of life.\" \u2014 John 8:12 (KJV)\n- **DOCTRINE** \u2014 \"Take heed unto thyself, and unto the doctrine; continue in them: for in doing this thou shalt both save thyself, and them that hear thee.\" \u2014 1 Timothy 4:16 (KJV)\n- **JOINED** \u2014 \"In him was life; and the life was the light of men.\" \u2014 John 1:4 (KJV)\n- **SOURCE** \u2014 \"for without me ye can do nothing\" \u2014 John 15:5 (KJV)\n\n## Variables (single source of truth \u2014 all workflows read these)\n\n| Variable | Default | Used by |\n|---|---|---|\n| BOOK / PASSAGE / TOPIC | \u2014 (required) | all workflows |\n| LESSON_COUNT | 5 | BuildWorkbook, DraftLessons |\n| AUDIENCE | TONA small group | BuildWorkbook, AdaptAudience |\n| SESSION_LENGTH | 75 minutes | DraftLessons (Gather), BackMatter |\n| EMPHASIS | balanced (doctrinal / devotional / evangelistic) | BuildWorkbook |\n| PACING | checkpoint (or run-all) | BuildWorkbook |\n\nUnspecified variables take their defaults silently \u2014 begin at once, ask no questions. Life, Light, and Detailed Doctrines are not variables: they are mandatory in every lesson, at every emphasis, for every audience.\n\n## Shared Definitions\n\n- **THE 5-LEVEL QUESTION LADDER** \u2014 Level 1: Observe (Easy) \u00b7 Level 2: Interpret (Medium) \u00b7 Level 3: Apply (Difficult) \u00b7 Level 4: Christocentric & Humility \u00b7 Level 5: Life & Light (Bring It). Every lesson climbs all five levels; every workflow uses this exact ladder.\n- **DETAILED DOCTRINAL SUMMARIZATION** \u2014 \"summarize in great details the doctrines for the [topic or scripture reference]\": every lesson systematically extracts, categorizes, and expounds all sound biblical doctrines anchored in the text (Theology Proper, Christology, Pneumatology, Anthropology, Hamartiology, Soteriology, Ecclesiology, Eschatology, and Covenant/Sanctification), providing formal propositions, textual proofs, and verbatim KJV cross-references.\n- **HUMILITY PRACTICES** \u2014 concrete tips, tricks, and daily hacks: specific mental exercises, habits, prayers, and spiritual practices for humbling oneself in the sight of the Lord and exalting Christ. Wherever this skill calls for Humility Practices, deliver at least 3, each doable within one day.\n- **THE LIFE PATHWAY** (John 10:10) \u2014 how a lesson teaches the participant to bring life, in four fixed slots:\n  (a) **THE THEFT** \u2014 the specific death, deadness, barrenness, or bondage this passage exposes, named in the passage's own terms, not in generalities.\n  (b) **THE SOURCE** \u2014 where the life actually is: Christ Himself, with the verse that says so, and the means He uses to give it (His word, His Spirit, His cross, His resurrection).\n  (c) **THE CHANNEL** \u2014 how that life passes *through* a believer to others as this passage frames it: words that quicken rather than kill (\"Death and life are in the power of the tongue\" \u2014 Proverbs 18:21), the gospel spoken plainly, forgiveness released, a burden carried, a hungry man fed, the barren thing tended until it bears.\n  (d) **LIFE PRACTICES** \u2014 at least 3, each doable within one day, at least one INWARD (how this believer receives Christ's life today) and at least one OUTWARD (how he carries it to a specific named person today).\n- **THE ABUNDANCE GUARD** \u2014 printed in every lesson: \"more abundantly\" in John 10:10 is fullness of life in Christ, not material prosperity, guaranteed ease, or freedom from suffering. Refuse that misreading out loud rather than leaving it unaddressed.\n- **THE LIGHT PATHWAY** (John 8:12) \u2014 how a lesson teaches the participant to bring light, in four fixed slots:\n  (a) **THE DARKNESS** \u2014 the specific darkness this passage addresses: ignorance, concealment, confusion, self-deceit, or the works done because no one is watching.\n  (b) **THE SOURCE** \u2014 Christ the light, with the verse; and how that light reaches a man (\"For God, who commanded the light to shine out of darkness, hath shined in our hearts, to give the light of the knowledge of the glory of God in the face of Jesus Christ.\" \u2014 2 Corinthians 4:6).\n  (c) **THE LAMP** \u2014 how light is carried: Scripture opened to someone in the dark (\"Thy word is a lamp unto my feet, and a light unto my path.\" \u2014 Psalm 119:105), truth told where a lie was convenient, hidden sin brought into the open and confessed, works of darkness reproved (\"And have no fellowship with the works of darkness, but rather reprove them.\" \u2014 Ephesians 5:11), and good works done visibly so that God, not the doer, is glorified (\"Let your light so shine before men, that they may see your good works, and glorify your Father which is in heaven.\" \u2014 Matthew 5:16).\n  (d) **LIGHT PRACTICES** \u2014 at least 3, each doable within one day, at least one that turns the light on the participant's OWN heart first, and at least one that carries light to another.\n- **THE LOVE GUARD** \u2014 printed in every lesson: light exposes, but a believer who exposes without love is glare, not light. Reproof is never license for accusation, contempt, or public shaming.\n- **SOURCE DISCIPLINE** \u2014 never present the participant as the origin of life or light. He is a channel and a reflector: \"for without me ye can do nothing\" (John 15:5). Every Humility, Life, and Light Practice must trace back to Christ with a verse, and no practice may be written so that it works by the participant's own energy, sincerity, or technique. Humility is not a separate topic from life and light \u2014 it is the posture in which both are received.\n- **THE LIFE & LIGHT PLANNERS** \u2014 the two participant write-in tables in lesson template points 16 and 17, where the participant names a person to carry life to and a dark place to carry light into, and dates it.\n- **THE 19-POINT LESSON TEMPLATE** \u2014 lives in `Workflows/DraftLessons.md`. Any workflow that drafts or re-drafts a lesson reads it there first.\n\n## Voice Notification\n\n**When executing a workflow, do BOTH:**\n\n1. **Send voice notification**:\n   ```bash\n   curl -s -X POST http://localhost:31337/notify \\\n     -H \"Content-Type: application/json\" \\\n     -d '{\"message\": \"Running the WORKFLOWNAME workflow in the Kjv2222 skill to ACTION\"}' \\\n     > /dev/null 2>&1 &\n   ```\n2. **Output text notification**:\n   ```\n   Running the **WorkflowName** workflow in the **Kjv2222** skill to ACTION...\n   ```\n\nFull documentation: `~/.claude/PAI/DOCUMENTATION/Notifications/NotificationSystem.md`\n\n## Workflow Routing\n\n| Workflow | Trigger | File |\n|---|---|---|\n| BuildWorkbook | \"build a workbook\", \"start study builder\", \"kjv2222\", \"kjv82\", \"kjv81\" | Workflows/BuildWorkbook.md |\n| DraftLessons | \"draft lesson\", \"CONTINUE lesson\" | Workflows/DraftLessons.md |\n| BackMatter | \"assemble back matter\", \"generate backmatter\" | Workflows/BackMatter.md |\n| VerifyWorkbook | \"verify workbook\", \"run verification pass\" | Workflows/VerifyWorkbook.md |\n| ExpandLesson | \"EXPAND lesson\" | Workflows/ExpandLesson.md |\n| AdaptAudience | \"ADAPT audience\" | Workflows/AdaptAudience.md |\n| LessonAnswers | \"ANSWERS lesson\" | Workflows/LessonAnswers.md |\n| AddLesson | \"ADD LESSON\" | Workflows/AddLesson.md |\n\n## Examples\n\n### Example 1: Initializing a combined workbook\n**User:** \"kjv2222: book=Ephesians, lesson_count=5\"\n* Invokes `BuildWorkbook` workflow\n* Moderates Steps 1-4 (Frame, Briefs, Deliberation incl. the Life & Light Audit, Blueprint)\n* Halts at the Step 4 checkpoint to print the workbook map \u2014 including each lesson's Life \u2192 Light line and Doctrinal Pillars \u2014 and await approval\n\n### Example 2: Drafting a lesson with case studies and toolkits\n**User:** \"CONTINUE to draft lesson 1\"\n* Invokes `DraftLessons` workflow\n* Drafts Lesson 1 using the 19-point Lesson Template (Observe, Interpret, Apply, Christocentric & Humility, Detailed Doctrines, Bring Life, Bring Light, etc.)\n\n### Example 3: Verifying the completed workbook\n**User:** \"verify workbook\"\n* Invokes `VerifyWorkbook` workflow\n* Runs the numbered V1-V18 audit (KJV verbatim quotes, glossary alignment, complete answer keys, detailed doctrinal summarization, \"I will...\" statements, Humility Practices, Life Pathway, Light Pathway, Source Discipline)\n\n## Gotchas\n\n* **KJV Only:** Never use or quote rival translations (NIV, ESV, NASB, NKJV). Double-check all verses verbatim; if uncertain of exact wording, quote less and append `(verify)` \u2014 never approximate inside quotation marks.\n* **Reformed Hermeneutics & Systematic Doctrines:** Let scripture interpret scripture. Focus on covenantal theology, sovereign grace, and the Law of First Mention. Summarize in great details the doctrines for the topic or scripture reference without skipping categories or compressing into a single paragraph.\n* **Write-in Spaces:** Participant guides must use actual lines `__________`. Exposition and answers belong in the Leader's Guide.\n* **No Placeholders:** Generate real biblical case studies, detailed doctrinal summaries, and modern examples without using placeholding summaries. The same rule binds the Life and Light Planners: real names go on the participant's line, not sample text.\n* **Verify References:** Never guess a Strong's number, verse reference, or historical quotation (creed, confession, hymn, sermon). Summarize a historical voice's known position rather than fabricate its words; if uncertain, append `(verify)`.\n* **Humility & Christ's Glory:** Every lesson must actively show how the believer is to humble themselves (reducing self-importance and pride) and make Christ more glorious (magnifying His name and work), delivering Humility Practices as defined above.\n* **Life & Light:** Every lesson must complete THE LIFE PATHWAY and THE LIGHT PATHWAY, print THE ABUNDANCE GUARD and THE LOVE GUARD, and carry both Planners with real write-in lines. A lesson that informs without bringing life, or heats without bringing light, is not finished \u2014 it is a `FIX`.\n* **Source Discipline:** Never write a practice, answer, or example that makes the participant the origin of life or light. Trace every practice to Christ with a verse.\n````\n\n## File 2 of 9 \u2014 `~/.claude/skills/Kjv2222/Workflows/BuildWorkbook.md`\n\n````markdown\n# BuildWorkbook Workflow\n\nThis workflow executes Steps 1 through 4 of the combined Berean Council and KJV Workbook builder process.\n\n## Voice Notification\n\n```bash\ncurl -s -X POST http://localhost:31337/notify \\\n  -H \"Content-Type: application/json\" \\\n  -d '{\"message\": \"Running the BuildWorkbook workflow in the Kjv2222 skill to initialize combined KJV curriculum and blueprint\"}' \\\n  > /dev/null 2>&1 &\n```\n\nRunning the **BuildWorkbook** workflow in the **Kjv2222** skill to initialize combined KJV curriculum and blueprint...\n\n## Instructions\n\nConvene the Berean Council of seven scholars under a Reformed hermeneutic lens (Scripture interprets Scripture, covenantal theology, sovereign grace):\n\n* **The Philologist** (Masoretic / Textus Receptus, word studies, Strong's numbers with the `(verify)` rule, archaic glosses, thee/thou vs. ye/you). Where the material speaks of life, death, light, or darkness, states which sense the KJV carries there.\n* **The Historian** (authorship, date, audience, geography, customs, politics).\n* **The Literary Scholar** (genre, structure, book argument, repetitions, divides lessons). Traces the life/death and light/darkness contrasts the material itself builds.\n* **The Theologian** (Reformed systematic doctrine, cross-references under the scripture-interprets-scripture rule). Establishes Christ as the single source of both life and light (John 1:4; John 10:10; John 8:12) \u2014 never the participant, never the workbook, never the method. Summarizes in great details the doctrines for the [topic or scripture reference] across the entire curriculum and per lesson.\n* **The Church Historian** (creeds, confessions, hymns, sermons \u2014 summarize known positions, never fabricate quotations).\n* **The Pastor** (sin exposed, grace offered, comfort, shepherding tender places, personal application, Humility Practices, and THE LIFE PATHWAY and THE LIGHT PATHWAY for each lesson).\n* **The Curriculum Architect** (learning objectives, the 5-level question ladder, case studies, modern examples, detailed doctrinal structure, the Life & Light Planners, write-in lines, Leader's Guide).\n\nExecute the following steps in sequence:\n\n### STEP 1 \u2014 Frame the Curriculum\n\n1. Restate the user's request with every variable resolved: Book/Passage/Topic, LESSON_COUNT (default 5), AUDIENCE (default TONA small group), SESSION_LENGTH (default 75 minutes), EMPHASIS (default balanced), PACING (default checkpoint). Apply defaults silently.\n2. If a TOPIC was given, choose 3-5 anchor passages and justify each in one line.\n3. Divide the material into `LESSON_COUNT` lessons along the passage/book's structure.\n4. State the workbook-wide Big Idea, 3-5 outcomes a participant should reach by the final lesson, and the central Doctrinal Pillars of the course.\n5. State the workbook-wide **Life & Light Frame** in two sentences: the death this material speaks into and the life Christ gives instead; the darkness it exposes and the light Christ gives instead.\n\n### STEP 2 \u2014 Expert Briefs\n\n1. Print a heading for each scholar in turn.\n2. Each scholar gives their 5-8 most load-bearing findings for the whole study.\n3. **Minimum requirements:**\n   * **Philologist:** one word-study candidate per lesson (including \"Law of First Mention\" candidates).\n   * **Theologian:** summarize in great details the doctrines for the [topic or scripture reference] across the curriculum and per lesson (Theology Proper, Christology, Pneumatology, Anthropology, Soteriology, Ecclesiology, Eschatology, and Covenantal Sanctification); 8-12 cross-references, plus the line from this material to Christ as the source of life and light (John 1:4).\n   * **Church Historian:** one historical voice per lesson.\n   * **Curriculum Architect:** draft objectives per lesson, at least one of them a *doing* objective \u2014 something the participant can do this week that brings life or light.\n   * **Pastor:** shepherding application; at least 3 Humility Practices for humbling oneself in the sight of the Lord and exalting Christ; and, per lesson, THE LIFE PATHWAY slots (a)-(c) and THE LIGHT PATHWAY slots (a)-(c). The full practice sets (\u22653 Life, \u22653 Light) are due in `Workflows/DraftLessons.md`.\n\n### STEP 3 \u2014 Council Deliberation\n\n1. As Moderator, pose the three hardest questions this material raises (interpretive cruxes, apparent tensions, common misreadings, or doctrinal controversies).\n2. Have relevant scholars discuss in dialogue.\n3. Every scholar must challenge or sharpen at least one claim made in STEP 2 \u2014 naming the scholar and the claim.\n4. Close each crux with a resolution from scripture, or a fair summary of the major views (routed to a View A / View B panel in the lesson where it belongs).\n5. Then pose a fourth, mandatory question \u2014 **THE LIFE & LIGHT AUDIT**:\n\n   > \"If a participant completed this whole course exactly as written, what in him would come alive, and what dark place would be lit? Name both, concretely, and say which lesson does it. If the honest answer is 'nothing but his notes,' the council names the fix before we blueprint.\"\n\n   The Pastor answers first; the Theologian checks the answer against SOURCE DISCIPLINE (has anything here been made to depend on the participant's own power?); the Curriculum Architect states which lesson component carries it and whether a Level 1 participant could do it. Print the fix if one was needed.\n\n### STEP 4 \u2014 Workbook Blueprint\n\n1. Print the lesson map as a markdown table with these columns: `Lesson | Title | Passage | Big Idea | Core Doctrines | Objective | Memory Verse (KJV ref) | Life \u2192 Light (what comes alive \u00b7 what gets lit)`\n2. Add the front-matter and back-matter plan (incorporating teacher FAQs, facilitation tools, student study toolkits, doctrinal master summary, and the course-long Life & Light Ledger).\n3. **Pacing Rule:**\n   * If `PACING = checkpoint` (default), **STOP** here and wait for the user's reply (`APPROVE` or adjustments).\n   * If `PACING = run-all`, state working assumptions and proceed immediately to `Workflows/DraftLessons.md` to draft the first lesson.\n````\n\n## File 3 of 9 \u2014 `~/.claude/skills/Kjv2222/Workflows/DraftLessons.md`\n\n````markdown\n# DraftLessons Workflow\n\nThis workflow executes Step 5 of the combined workbook builder process, drafting the lessons. It owns THE 19-POINT LESSON TEMPLATE \u2014 other workflows (ExpandLesson, AddLesson) read it from here.\n\n## Voice Notification\n\n```bash\ncurl -s -X POST http://localhost:31337/notify \\\n  -H \"Content-Type: application/json\" \\\n  -d '{\"message\": \"Running the DraftLessons workflow in the Kjv2222 skill to draft lessons using the 19-point template\"}' \\\n  > /dev/null 2>&1 &\n```\n\nRunning the **DraftLessons** workflow in the **Kjv2222** skill to draft lessons using the 19-point template...\n\n## Instructions\n\nDraft the lessons one by one, in order, according to the approved Workbook Blueprint.\n\nFor each lesson, use this fixed, 19-point template:\n\n1. **Heading** \u2014 Lesson number, title, passage, Big Idea, objective: one line each.\n2. **Open** \u2014 A prayer focus (suggesting Psalm 119:18) and one warm-up question with write-in lines `__________`.\n3. **Setting the Scene** \u2014 The Historian's context in 150-250 words.\n4. **Read & Mark** \u2014 The full passage printed in the KJV with a marking key: circle repeated words, underline commands, box names of God, double-underline promises. Passages over ~25 verses appear in marked sections.\n5. **Observe (Level 1: Easy)** \u2014 5-8 \"what does it say?\" questions anchored to specific verses, write-in lines under each. Focus on key KJV words, who is speaking/addressed, and literal text facts.\n6. **Mind the Language** \u2014 Flagged archaic KJV words; the participant writes the modern sense beside each before checking the Glossary.\n7. **Word Study** \u2014 A table with columns: `KJV word | verse | original word (transliterated, Strong's #) | sense | participant lookup`. If uncertain of a Strong's number, write `(verify)` instead of guessing. The participant lookup column directs: look up another KJV occurrence (checking the Law of First Mention) and write what it adds.\n8. **Search the Scriptures** \u2014 A chain of 3-6 cross-references with a summary line for each, closing with one synthesis line: what do these passages together teach? (Reformed lens: Scripture interprets Scripture).\n9. **Interpret (Level 2: Medium)** \u2014 3-5 \"what does it mean?\" questions. Disputed points must appear as View A / View B panels with proof texts and a \"which view does the text best support, and why?\" write-in.\n10. **Case Study: Scripture in Action** \u2014 A biblical case study showing a Bible character (e.g. Abraham, David, Paul) applying or misapplying the core lesson truth, closing with a reflection question and write-in lines.\n11. **Modern Example** \u2014 A realistic 21st-century scenario showing a believer facing a cultural or faith challenge, resolving it by applying the core text, and experiencing the biblical result. Add a reflection question with write-in lines.\n12. **Voices from Church History** \u2014 One short creed, confession, hymn, or sermon excerpt with a reflection line. Quote only wording you are certain of; otherwise summarize the voice's known position and mark `(verify)`.\n13. **Doctrine** \u2014 Summarize in great details the doctrines for the [topic or scripture reference]: comprehensive, systematic exposition of all sound biblical doctrines taught, implied, or defended in this passage (e.g., Theology Proper, Christology, Pneumatology, Anthropology/Hamartiology, Soteriology, Ecclesiology, Eschatology, and Covenantal Sanctification). Each doctrine is presented with its formal theological proposition, clear explanation, direct textual anchor from the passage, and 2-3 supporting KJV cross-references (Reformed Covenantal perspective: Scripture interprets Scripture), followed by participant synthesis write-in lines (\"State each core doctrine in your own words and how it anchors your faith: __________\").\n14. **Apply (Level 3: Difficult)** \u2014 Head (believe), Heart (love), Hands (do) questions connecting the topic to the gospel of grace. Include questions on how to humble oneself before God and glorify Christ, closing with an \"I will...\" concrete commitment statement.\n15. **Christocentric & Humility (Level 4)** \u2014 Explain that every problem found in the scripture, the answer is Jesus; explain that every revelation or principle found in the scripture is found in Jesus, because in Jesus is hidden all the wisdom of God (Colossians 2:3). Detail how the passage calls us to humble ourselves before God and make Christ glorious, delivering Humility Practices for daily use. Add a reflection question with write-in lines.\n16. **Bring Life (Level 5a \u2014 John 10:10)** \u2014 Build THE LIFE PATHWAY for this passage on the participant page, in this order:\n    * **The Theft** \u2014 one or two sentences naming the specific death, deadness, barrenness, or bondage this passage exposes, in the passage's own terms.\n    * **The Source** \u2014 the Christ-and-verse line: where the life is, and how He gives it.\n    * **The Channel** \u2014 2-3 sentences on how that life passes through a believer to another person as this passage frames it.\n    * **Questions** \u2014 3-4 Level 5 questions with write-in lines: what has the thief stolen where I live? what does Christ give instead, and in whose life am I withholding it?\n    * **THE LIFE PLANNER** \u2014 a write-in table:\n\n      | Who around me is dead, dying, or deadened? (name) | What has the thief stolen there? | What does Christ give instead (verse) | What I will do about it this week | Done? |\n      |---|---|---|---|---|\n      | `__________` | `__________` | `__________` | `__________` | `____` |\n\n    * **Life Practices** \u2014 at least 3 from THE LIFE PATHWAY (d), each doable within one day, at least one inward and one outward, each traced to Christ with a verse per SOURCE DISCIPLINE.\n    * **Commitment** \u2014 `I will bring life to __________ by __________ before __________ (day).`\n    * **THE ABUNDANCE GUARD**, printed in italics on the page: *abundant life is fullness of life in Christ \u2014 not money, not ease, not freedom from suffering.*\n17. **Bring Light (Level 5b \u2014 John 8:12)** \u2014 Build THE LIGHT PATHWAY for this passage on the participant page, in this order:\n    * **The Darkness** \u2014 one or two sentences naming the specific darkness this passage addresses.\n    * **The Source** \u2014 the Christ-and-verse line: where the light is, and how it reaches a man.\n    * **The Lamp** \u2014 2-3 sentences on how the light is carried, in this passage's terms.\n    * **Questions** \u2014 3-4 Level 5 questions with write-in lines, the first one turned inward: what am I keeping in the dark, and what would change if I brought it out?\n    * **THE LIGHT PLANNER** \u2014 a write-in table, the first row reserved for the participant's own heart:\n\n      | Where is it dark? (mine first, then around me) | What is hidden there? | What light does Christ shine (verse) | How I carry it there this week \u2014 in love, not accusation | Done? |\n      |---|---|---|---|---|\n      | `__________` | `__________` | `__________` | `__________` | `____` |\n\n    * **Light Practices** \u2014 at least 3 from THE LIGHT PATHWAY (d), each doable within one day, at least one self-examining and one outward, each traced to Christ with a verse per SOURCE DISCIPLINE.\n    * **Commitment** \u2014 `I will carry light i
